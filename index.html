<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
/* Intercept #vote-section hash before browser's native scroll fires.
   GSAP pin spacers don't exist yet, so we kill the jump here and replay
   it after ScrollTrigger.refresh() runs (~500 ms into load). */
(function(){
  if(window.location.hash==='#vote-section'){
    history.replaceState(null,'',window.location.pathname+window.location.search);
    window.__scrollToVote=true;
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tom Brady Is Not The GOAT</title>
<script>
/* ─────────────────────────────────────────────────────────────
   MOBILE VIEWPORT SHIM — runs before any CSS is painted.
   Android URL-bar transitions make svh/dvh/vh resolve short on
   first scroll-in, causing the pinned .section-stage to lock at
   a too-short height. The .cards-col elements (height:110vh)
   and .rive-clip (70svh) then float inside a shrunken stage,
   producing the "4 tiny avatars in corners" and "shoes only"
   symptoms. Fix: publish --vh-px from window.innerHeight and
   keep a grow-only high-water mark so URL-bar retract never
   shrinks the pinned viewport. Orientation change resets it.
──────────────────────────────────────────────────────────────*/
(function(){
  /* Prefer visualViewport.height when available — it returns the actual
     visible viewport height, unaffected by mobile URL bar animation
     intermediate states the way window.innerHeight is. innerHeight is
     only used as a fallback. Test 1 of the mobile-pin investigation. */
  function currentVH() {
    if (window.visualViewport && window.visualViewport.height) {
      return Math.round(window.visualViewport.height);
    }
    return window.innerHeight || document.documentElement.clientHeight || 0;
  }
  var lastH = 0;
  function setVH(){
    var h = currentVH();
    if (!h) return;
    if (h > lastH) lastH = h;
    document.documentElement.style.setProperty('--vh-px', lastH + 'px');
    document.documentElement.style.setProperty('--vh',   (lastH/100) + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH, {passive:true});
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setVH, {passive:true});
  }
  window.addEventListener('orientationchange', function(){
    lastH = 0;                       /* new orientation = new universe */
    setTimeout(setVH, 150);
    setTimeout(setVH, 400);
  }, {passive:true});
  /* Debounced ScrollTrigger refresh when viewport meaningfully changes. */
  var refreshT = null, refreshLast = 0;
  function debouncedRefresh(){
    var h = currentVH();
    if (Math.abs(h - refreshLast) < 40) return;
    refreshLast = h;
    clearTimeout(refreshT);
    refreshT = setTimeout(function(){
      if (window.ScrollTrigger && typeof window.ScrollTrigger.refresh === 'function') {
        window.ScrollTrigger.refresh();
      }
    }, 220);
  }
  window.addEventListener('resize', debouncedRefresh, {passive:true});
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', debouncedRefresh, {passive:true});
  }
  window.addEventListener('orientationchange', debouncedRefresh, {passive:true});
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Preload hero impact assets so first-scroll transition is smooth.
     Without these, the browser starts fetching tom-brady-shocked.png
     (3.2 MB) only when the impact fires, producing a visible stutter
     on first play. Subsequent plays are smooth because the image is
     cached. Preload moves that fetch to initial page load. -->
<link rel="preload" as="image" href="Assets/tom-brady-shocked.png">
<link rel="preload" as="image" href="Assets/goat.svg">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Germania+One&family=Shrikhand&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>

/* ═══ GLOBAL ═══ */
* { margin:0; padding:0; box-sizing:border-box; }
html { background:#07090C; }
body { font-family:'Space Grotesk',system-ui,sans-serif; overflow-x:hidden; }

/* ── Global focus-visible (keyboard affordance) ── */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid rgba(242,237,228,.65);
  outline-offset: 3px;
  border-radius: 2px;
}


/* ═══════════════════════════════════════════
   SECTION 01 — HERO
═══════════════════════════════════════════ */
.hero {
  position:relative; height:100dvh; min-height:520px; max-height:1100px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding-top:max(clamp(10px,2vh,28px), env(safe-area-inset-top));
  padding-bottom:clamp(48px,10dvh,120px);
  /* overflow:visible so the shocked Brady illo can zoom past the hero's
     bottom edge during the impact phase without being clipped.
     The background layers (.hero-bg, .hero-vignette, .hero-scanlines)
     are absolutely positioned with inset:0 so they still stay contained. */
  overflow:visible;
}
.hero-bg {
  position:absolute; inset:0;
  background:radial-gradient(ellipse 75% 55% at 50% 52%, #1F0B09 0%, #07090C 68%);
}
.hero-vignette {
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 100% 40% at 50% 0%,  rgba(0,0,0,.6) 0%, transparent 100%),
    radial-gradient(ellipse 100% 30% at 50% 100%, rgba(0,0,0,.5) 0%, transparent 100%);
  pointer-events:none;
}
.hero-scanlines {
  position:absolute; inset:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);
  pointer-events:none;
}
.headline { position:relative; z-index:10; text-align:center; line-height:.88; user-select:none; }
/* Proportional type: min is readable floor, preferred scales with viewport height + width, max keeps desktop sane */
.line-preamble {
  font-family:'Germania One',cursive;
  font-size:clamp(22px, min(5vw, 8vh), 84px);
  letter-spacing:.14em; color:#F2EDE4; text-transform:uppercase; opacity:.82;
  line-height:1;
}
.line-not-wrap  { display:block; overflow:visible; position:relative; }
.line-not {
  font-family:'Shrikhand',cursive;
  /* Sized so NOT lands within the bottom third of the silhouette, not
     over Brady's torso. Capped shorter than the illo-wrap height. */
  font-size:clamp(90px, min(20vw, 28dvh), 280px);
  letter-spacing:-.01em; color:#C8102E;
  text-transform:uppercase; display:inline-block; position:relative; line-height:.9;
  text-shadow:0 0 60px rgba(200,16,46,.5),0 0 120px rgba(200,16,46,.2),0 2px 0 rgba(0,0,0,.6);
}
.line-not::after {
  content:''; position:absolute; bottom:6px; left:-2px; right:-2px;
  height:5px; background:#C8102E; transform:scaleX(0); transform-origin:left;
}
.line-not.struck::after { transform:scaleX(1); transition:transform .25s ease-out .05s; }
.line-bottom {
  font-family:'Germania One',cursive;
  font-size:clamp(22px, min(5vw, 8vh), 84px);
  letter-spacing:.14em; color:#F2EDE4;
  text-transform:uppercase; opacity:.82;
  display:flex; align-items:center; justify-content:center; gap:clamp(4px,1vw,16px);
  position:relative;
  margin-top:clamp(4px,1vh,16px);
  line-height:1;
}
/* Ensure both children inherit Germania One (was falling back to body Impact) */
.line-bottom > span { font-family:inherit; }
#crown-anchor { position:relative; display:inline-flex; align-items:center; }
#crown-svg {
  position:absolute;
  left:0; top:0; /* JS overrides via positionCrownOnHead() */
  width:clamp(30px,9.7%,400px);
  filter:brightness(1.4) drop-shadow(0 2px 8px rgba(0,0,0,.9)) drop-shadow(0 0 18px rgba(212,175,55,.6));
  z-index:10;
  opacity:0;
}
.illo-wrap {
  position:relative; z-index:8; margin-top:clamp(2px,1vh,12px);
  /* Illustration height keys to dynamic viewport height so NOT always has room to drop */
  width:min(90vw,900px);
  height:clamp(240px, 48dvh, 720px);
  border:none; border-radius:0; overflow:visible;
}
.headline-lower {
  position:relative; z-index:10; text-align:center; line-height:.88;
  user-select:none; margin-top:2px;
}
#hero-goat {
  position:absolute;
  left:0; top:0; /* JS overrides via positionGoatOnImage() */
  width:clamp(30px,27.6%,400px);
  transform-origin:right center;
  opacity:0;
}
.illo-icon { font-size:clamp(28px,4vw,48px); opacity:.12; line-height:1; }
.illo-label {
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:clamp(9px,1vw,11px);
  letter-spacing:.14em; color:rgba(242,237,228,.28); text-transform:uppercase;
  text-align:center; line-height:1.7;
}
.illo-label em {
  display:block; font-style:normal; color:rgba(212,175,55,.45);
  font-size:clamp(10px,1.1vw,12px); letter-spacing:.1em; margin-bottom:2px;
}
.subtext, .scroll-hint { display: none !important; }
.particle { position:fixed; border-radius:50%; pointer-events:none; z-index:100; }

/* Scroll cue — hidden by default, enabled on mobile via media query */
.hero-scroll-cue { display: none; }
.hero-scroll-cue .cue-chev {
  width: 26px; height: 26px;
  color: rgba(242,237,228,.55);
  animation: cueBob 1.8s ease-in-out infinite;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,.6));
}
.hero-scroll-cue .cue-label {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 10px; letter-spacing: .24em; text-transform: uppercase;
  color: rgba(242,237,228,.38);
  margin-right: 10px; align-self: center;
}
@keyframes cueBob {
  0%,100% { transform: translateY(0); opacity: .55; }
  50%     { transform: translateY(6px); opacity: .95; }
}

/* ── NOT text is hidden until JS fires (prevents FOUC) ── */
#not-text { opacity:0; }

/* ═══════════════════════════════════════════
   HERO — RESPONSIVE
   Mobile-first: base styles = mobile, scale up at md/lg.
   Clamps key from dvh so browser chrome doesn't throw off sizing.
═══════════════════════════════════════════ */

/* Tablet landscape */
@media (max-width: 1024px) {
  .illo-wrap { width: min(90vw, 680px); }
}

/* Narrow desktop + tablet portrait (481–900px):
   Prevents NOT from dominating the silhouette on thin browser windows —
   cap it so Brady remains visible behind/around the word. */
@media (min-width: 481px) and (max-width: 900px) {
  .line-not {
    font-size: clamp(90px, min(18vw, 26dvh), 240px);
  }
  .line-preamble, .line-bottom {
    font-size: clamp(22px, min(4.2vw, 6.5vh), 64px);
  }
  .illo-wrap {
    height: clamp(280px, 52dvh, 540px);
  }
}

/* Tablet portrait */
@media (max-width: 768px) {
  .line-preamble { letter-spacing: .12em; }
  .line-bottom   { letter-spacing: .12em; }
  .illo-wrap     { width: min(94vw, 560px); }
}

/* ── Mobile (≤ 480px) — intentional mobile layout, not scaled desktop ── */
@media (max-width: 480px) {
  .hero {
    /* Center the composition vertically so there's no big gap beneath "THE GOAT".
       Also shrink the bottom padding — the scroll cue handles wayfinding. */
    justify-content: center;
    padding-top:  max(8px, env(safe-area-inset-top));
    padding-bottom: clamp(48px, 9dvh, 80px);
  }
  /* Larger text floors so headlines read at arm's length */
  .line-preamble {
    font-size: clamp(28px, 7.5vw, 84px);
    letter-spacing: .10em;
  }
  .line-not {
    /* Bigger floor — "NOT" should feel like a physical impact on small screens */
    font-size: clamp(100px, 26vw, 360px);
  }
  .line-bottom {
    font-size: clamp(28px, 7.5vw, 84px);
    letter-spacing: .10em;
    gap: clamp(4px, 2vw, 10px);
  }
  /* Tighter illo — pairs with centered hero so composition fills viewport
     without leaving a big gap under "THE GOAT". */
  .illo-wrap {
    width: min(98vw, 440px);
    height: clamp(240px, 44dvh, 420px);
    margin-top: clamp(4px, 1dvh, 10px);
  }
  /* Tighten gap between illo and lower headline */
  .headline-lower { margin-top: 0; }

  /* Scroll cue — small pulsing chevron anchored to the hero bottom so users
     know there's more below, since the centered composition no longer fills
     the full viewport. */
  .hero-scroll-cue {
    display: flex !important;
    position: absolute;
    left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom));
    justify-content: center;
    pointer-events: none;
    z-index: 11;
  }
}

/* Short viewports (laptops 540–720px tall) — tighten stacking */
@media (max-height: 720px) {
  .hero { padding-bottom: clamp(16px, 4dvh, 48px); }
  .illo-wrap { margin-top: 0; }
  .line-bottom { margin-top: clamp(2px, 0.5dvh, 8px); }
}

/* Landscape phones — minimal padding, shorter illo */
@media (max-height: 500px) and (orientation: landscape) {
  .scroll-hint { display: none; }
  .hero { padding-top: 8px; padding-bottom: 12px; }
  .illo-wrap { height: clamp(160px, 42dvh, 260px); }
}

/* ═══════════════════════════════════════════
   RIVE PUPPET — inside .center-card
   center-card is position:absolute full-screen flex-centered.
   .rive-clip is landscape-ish so Rive's Cover+TopCenter
   fills to width and clips off the legs naturally.
═══════════════════════════════════════════ */
/* Desktop: landscape-ish clip so Cover+TopCenter fills width and crops legs.
   Mobile: taller portrait clip anchored so the puppet's head/torso lands
   in the center-visible band instead of way up top or cropped weird. */
.rive-clip {
  width: min(700px, 80vw);
  height: 88vh;
  height: 88svh;
  /* Pixel fallback from the JS shim — fixes the "shoes only visible"
     symptom on Android where 88svh resolves short during URL-bar
     animation, cropping the puppet to just its feet. */
  height: calc(var(--vh-px, 88vh) * 0.88);
  flex-shrink: 0;
  position: relative;
}
@media (max-width: 768px) {
  /* Use svh (small viewport height — excludes browser chrome) so the puppet
     doesn't jump around when the mobile URL bar shows/hides. Width is wider
     relative to height so Cover+TopCenter crops legs but keeps torso visible. */
  .rive-clip {
    width: min(520px, 96vw);
    height: 70svh;
    height: calc(var(--vh-px, 70vh) * 0.70);
    max-height: 560px;
  }
}
@media (max-width: 768px) and (orientation: landscape) {
  .rive-clip { width: 70svw; height: 82svh; height: calc(var(--vh-px, 82vh) * 0.82); }
}

/* ═══════════════════════════════════════════
   SECTION 02 — INTRO
   position:relative only — GSAP ScrollTrigger
   handles pinning (replaces position:sticky for
   cross-browser reliability in multi-section pages)
═══════════════════════════════════════════ */
/* ═══════════════════════════════════════════
   SECTION 01b — BRADY PARTY PAYOFF
   Sits between hero and intro. Cream bg matches intro's starting state
   so the hand-off is seamless. Pinned 500vh of scroll. Phases: DANCE →
   LIGHTNING → PARTY → WIND-DOWN. Timeline driven by ScrollTrigger scrub.
═══════════════════════════════════════════ */
/* Party choreography lives inside the intro section. These background
   layers (cream ↔ club cross-fade) sit behind everything else; the
   .party-on class toggled on #section-stage drives the transitions. */
.bg-cream { position:absolute; inset:0; background:#F5F1EB; z-index:0; transition:opacity .6s ease; }
.bg-club  {
  position:absolute; inset:0; z-index:1; opacity:0;
  background:
    radial-gradient(ellipse 70% 60% at 50% 35%, rgba(255,190,120,.55) 0%, rgba(255,190,120,0) 60%),
    #0B0C0E;
  transition:opacity .6s ease;
}
.bg-scanlines {
  position:absolute; inset:0; z-index:2; opacity:0; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px);
  mix-blend-mode:overlay;
  transition:opacity .6s ease;
}
/* Rive canvases inside .rive-clip — stacked for cross-fade between the
   idle dance puppet and the rocking puppet. Rocker starts invisible. */
#rive-clip canvas {
  position:absolute; inset:0; width:100%; height:100%; display:block;
  transition:opacity .45s ease;
  /* Promote to own compositor layer so parent center-card's shrink
     transform can't cache a low-res raster of these canvases — without
     this, the puppet renders blurry when you scroll back up past the
     chart because the browser reuses the scaled-down rasterization. */
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;
}
#rive-rocking-party { opacity:0; }
#rive-dance-party   { opacity:1; }
/* Lights: ambient CSS animations (NOT scroll-driven) — turned on via
   .party-on class when the timeline enters the party phase. */
.party-lights {
  position:absolute; inset:0; z-index:4; opacity:0; pointer-events:none;
  transition:opacity .5s ease;
}
/* Three colored stage spotlights — narrow at the source (top of frame),
   widening and fading as they descend to where Brady stands. Each beam
   is a clipped linear-gradient box; heavy blur softens the edges, and
   each sways slowly on its own offset schedule so they sweep/converge
   around the puppet instead of sitting static. */
.party-spot {
  position:absolute;
  top:-10vh; left:50%;
  width:24vw; height:140vh;
  margin-left:-12vw;
  transform-origin:50% 0%;
  mix-blend-mode:screen;
  pointer-events:none;
  will-change:transform;
  /* Slightly more trapezoidal than before, plus a heavy blur + reduced
     opacity so the beams read as diffuse light rather than rigid bars. */
  clip-path:polygon(46% 0%, 54% 0%, 86% 100%, 14% 100%);
  filter:blur(56px);
  opacity:.62;
}
.party-spot.pink {
  background:linear-gradient(to bottom,
    rgba(255,45,158,.70)  0%,
    rgba(255,45,158,.32) 48%,
    rgba(255,45,158,.08) 82%,
    rgba(255,45,158,0)   100%);
  margin-left:-36vw;
  transform:rotate(22deg);
  animation:spotSwayA 9s ease-in-out infinite;
}
.party-spot.cyan {
  background:linear-gradient(to bottom,
    rgba(30,228,255,.65) 0%,
    rgba(30,228,255,.30) 48%,
    rgba(30,228,255,.07) 82%,
    rgba(30,228,255,0)   100%);
  margin-left:-12vw;
  transform:rotate(-3deg);
  animation:spotSwayB 11.5s ease-in-out -3s infinite;
}
.party-spot.gold {
  background:linear-gradient(to bottom,
    rgba(255,199,0,.65) 0%,
    rgba(255,199,0,.30) 48%,
    rgba(255,199,0,.07) 82%,
    rgba(255,199,0,0)   100%);
  margin-left:12vw;
  transform:rotate(-18deg);
  animation:spotSwayC 13s ease-in-out -7s infinite;
}
@keyframes spotSwayA {
  0%,100% { transform:rotate(22deg); }
  50%     { transform:rotate(30deg); }
}
@keyframes spotSwayB {
  0%,100% { transform:rotate(-6deg); }
  50%     { transform:rotate( 4deg); }
}
@keyframes spotSwayC {
  0%,100% { transform:rotate(-18deg); }
  50%     { transform:rotate(-26deg); }
}
.party-strobe {
  position:absolute; inset:0; background:#FFFFFF; opacity:0;
  mix-blend-mode:overlay; animation:strobeFlicker 1.1s steps(1) infinite;
}
@keyframes strobeFlicker { 0%,88%,94%,100%{opacity:0} 90%{opacity:.3} 96%{opacity:.18} }

/* Starfield — 60-80 tiny blurred dots seeded by JS with random positions,
   staggered twinkle durations and delays. "Distant lights in a club" feel. */
.party-specks { position:absolute; inset:0; pointer-events:none; }
.speck {
  position:absolute; width:5px; height:5px; border-radius:50%;
  background:#FFFFFF;
  filter:blur(.7px);
  mix-blend-mode:screen;
  opacity:0;
  animation:speckTwinkle var(--dur,1.4s) ease-in-out var(--delay,0s) infinite;
}
@keyframes speckTwinkle {
  0%,100% { opacity:0;              transform:scale(.85); }
  50%     { opacity:var(--peak,.7); transform:scale(1);   }
}
/* One-shot lightning flash — opacity driven by JS */
.party-lightning {
  position:absolute; inset:0; z-index:6;
  background:linear-gradient(100deg, transparent 0%, rgba(255,255,255,.95) 45%, transparent 90%);
  opacity:0; mix-blend-mode:screen; pointer-events:none;
  transform:translateX(-100%);
}
.party-lightning.flash {
  animation:lightningSweep .42s cubic-bezier(.2,.8,.3,1) 1;
}
@keyframes lightningSweep {
  0%   { opacity:0; transform:translateX(-100%); }
  30%  { opacity:1; }
  60%  { opacity:.85; transform:translateX(0%); }
  100% { opacity:0; transform:translateX(100%); }
}
/* Party-on state — toggled by JS at progress >= 0.20 */
.party-on .bg-cream           { opacity:0; }
.party-on .bg-club            { opacity:1; }
.party-on .bg-scanlines       { opacity:.45; }
.party-on .party-lights       { opacity:1; }
.party-on #rive-rocking-party { opacity:1; }
.party-on #rive-dance-party   { opacity:0; }
/* Accolade cards — 4 corners, rotated, pop-in via .in / glitch-out via .out */
.accolades { position:absolute; inset:0; z-index:8; pointer-events:none; }
.accolade {
  position:absolute; left:var(--x); top:var(--y);
  width:min(340px, 68vw); max-width:86vw;
  padding:20px 24px 22px;
  background:#0B0C0E; color:#FFFFFF;
  border:1.5px solid #FFFFFF;
  box-shadow:0 22px 48px rgba(0,0,0,.48);
  transform:translate(-50%,-50%) rotate(var(--rot)) scale(.2);
  opacity:0;
  transform-origin:50% 50%;
}
/* Colored-card variants keep the default black background + white text
   from the base .accolade style — only the border (and matching glow +
   stat color) changes, so every card shares the same dark treatment
   and the color reads as an accent rather than a fill. */
.accolade.blue { border-color:#1EE4FF; box-shadow:0 22px 48px rgba(30,228,255,.30); }
.accolade.pink { border-color:#FF2D9E; box-shadow:0 22px 48px rgba(255,45,158,.32); }
.accolade.gold { border-color:#FFC700; box-shadow:0 22px 48px rgba(255,199,0,.28); }
.accolade.blue .a-stat { color:#1EE4FF; }
.accolade.pink .a-stat { color:#FF2D9E; }
.accolade.gold .a-stat { color:#FFC700; }
.accolade .a-stat {
  font-family:'Shrikhand', cursive;
  font-size:clamp(56px, 9vw, 92px);
  line-height:.9; letter-spacing:-.02em;
  display:inline-block; position:relative;
}
.accolade.bungee .a-stat {
  font-family:'Bungee', 'Shrikhand', cursive;
  font-size:clamp(50px, 8vw, 82px);
}
.accolade .a-stat::before,
.accolade .a-stat::after {
  content:attr(data-val); position:absolute; inset:0;
  pointer-events:none; mix-blend-mode:screen;
}
.accolade .a-stat::before { color:#FF2D9E; transform:translate(-2px, 0); }
.accolade .a-stat::after  { color:#1EE4FF; transform:translate(2px, 0);  }
.accolade.gold .a-stat::before,
.accolade.gold .a-stat::after,
.accolade.blue .a-stat::before,
.accolade.blue .a-stat::after,
.accolade.pink .a-stat::before,
.accolade.pink .a-stat::after { display:none; }
.accolade .a-label {
  font-family:'JetBrains Mono', ui-monospace, monospace;
  font-size:14px; letter-spacing:.32em; font-weight:700;
  text-transform:uppercase;
  margin-top:8px; display:block;
}
.accolade .a-note {
  font-family:'JetBrains Mono', ui-monospace, monospace;
  font-size:11px; letter-spacing:.22em; font-weight:400;
  text-transform:uppercase; color:#9A8F82;
  margin-top:10px; display:block; line-height:1.5;
}
.accolade.in {
  opacity:1;
  transform:translate(-50%,-50%) rotate(var(--rot)) scale(1);
  transition:opacity .35s ease-out, transform .55s cubic-bezier(.2,1.8,.35,1);
}
.accolade.out {
  opacity:0;
  transform:translate(-50%,-50%) rotate(calc(var(--rot) + 4deg)) scale(1.08) skewX(12deg);
  filter:blur(1.5px);
  transition:opacity .25s ease-in, transform .35s cubic-bezier(.7,0,.9,.3), filter .3s;
}
/* Card corner placements (desktop). --x/--y are center points. */
.accolade[data-idx="1"] { --x: 18%; --y: 24%; --rot: -6deg; }
.accolade[data-idx="2"] { --x: 82%; --y: 26%; --rot:  4deg; }
.accolade[data-idx="3"] { --x: 20%; --y: 76%; --rot: -3deg; }
.accolade[data-idx="4"] { --x: 80%; --y: 74%; --rot:  5deg; }
@media (max-width: 620px) {
  /* Narrower cards + tighter padding so they fit inside the viewport
     without clipping on either side at 320-430px wide screens. Card
     centers moved closer to horizontal midline (32%/68%) for the same
     reason — half-width now stays inside viewport bounds. */
  .accolade { width:min(215px, 58vw); padding:12px 14px 14px; }
  .accolade .a-stat  { font-size:clamp(40px, 11vw, 58px); }
  .accolade .a-label { font-size:11px; letter-spacing:.22em; }
  .accolade .a-note  { font-size:9px;  letter-spacing:.16em; }
  .accolade[data-idx="1"] { --x: 32%; --y: 16%; }
  .accolade[data-idx="2"] { --x: 68%; --y: 18%; }
  .accolade[data-idx="3"] { --x: 32%; --y: 84%; }
  .accolade[data-idx="4"] { --x: 68%; --y: 82%; }
  .party-spot { width:40vw; filter:blur(38px); opacity:.55; }
  .party-spot.pink { margin-left:-48vw; }
  .party-spot.cyan { margin-left:-20vw; }
  .party-spot.gold { margin-left:  8vw; }
}
@media (prefers-reduced-motion: reduce) {
  .party-spot, .speck, .party-strobe { animation:none !important; }
  .party-strobe { opacity:0 !important; }
  .speck       { opacity:.5 !important; }
}

.intro-section {
  position:relative;
  /* 2300vh = ~700vh for the party phase + 1600vh for the original intro
     choreography (dwell, shrink, words, chart handoff). */
  height:2300vh;
  background:#F5F1EB;
}
.section-stage {
  position:relative; top:0; width:100%;
  /* Pixel-based height from JS shim (--vh-px) — grows-only high-water
     mark so Android URL bar transitions can't lock us at a short value.
     Falls back to svh/vh if the shim didn't execute yet. */
  height:100vh;
  height:100svh;
  height:var(--vh-px, 100svh);
  overflow:hidden;
  background:#F5F1EB;
}
.center-card {
  /* Background is transparent so the party-phase bg-club / scanline
     layers behind it show through during the party. The shrunk-card
     "inside" look that used to come from this element's #EEEBE4 fill
     is now provided by .bg-cream (shown once the party winds down and
     the center-card clips into its small rounded-rect state). */
  position:absolute; top:0; left:0; width:100%; height:100%;
  will-change:transform,clip-path; transform-origin:center center;
  background:transparent; display:flex; align-items:center; justify-content:center; z-index:3;
}
.cards-col {
  position:absolute; top:0; display:flex; flex-direction:column;
  justify-content:space-around;
  /* Pixel-based height via --vh-px — without this, the 4 corner columns
     float inside a short stage on Android (the "tiny avatars clinging to
     corners" bug) because 110vh resolves against the wrong viewport. */
  height:110vh;
  height:calc(var(--vh-px, 100vh) * 1.10);
  padding:clamp(16px,2.5vh,40px) 0; gap:clamp(14px,2vh,30px);
  z-index:5; will-change:transform;
}
.col-far-left  { left: clamp(6px,1.8vw,28px); }
.col-near-left { left: clamp(9%,15vw,210px); }
.col-near-right{ right:clamp(9%,15vw,210px); }
.col-far-right { right:clamp(6px,1.8vw,28px); }
@media (max-width:899px) { .col-near-left,.col-near-right { display:none; } }
/* On mobile pull the far-L / far-R columns inward and scale up the
   player-cards so they don't look lost hugging the viewport edges
   while the words animate. Reader feedback: too much empty space
   between the card columns and the center text. */
@media (max-width:480px) {
  .col-far-left  { left:  clamp(14px, 4vw, 32px); }
  .col-far-right { right: clamp(14px, 4vw, 32px); }
  .player-card   { width: clamp(92px, 24vw, 130px); height: clamp(92px, 24vw, 130px); }
}
.player-card {
  width:clamp(68px,10vw,128px); height:clamp(68px,10vw,128px);
  border-radius:50%; background:#07090C;
  box-shadow:0 3px 16px rgba(26,22,20,.10);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; position:relative; flex-shrink:0;
  transition:box-shadow .25s,transform .25s;
}
.player-card:hover {
  box-shadow:0 10px 32px rgba(26,22,20,.18);
  transform:scale(1.05);
}
.face-wrap { width:100%; height:100%; border-radius:50%; overflow:hidden; }
.face-svg  { width:100%; height:100%; display:block; }
.word-slot {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  text-align:center; white-space:nowrap; line-height:1;
  letter-spacing:-.025em; text-transform:uppercase;
  opacity:0; z-index:20; pointer-events:none; overflow:hidden;
  padding:0 clamp(14px,5vw,80px);
  font-family:Impact,Haettenschweiler,'Arial Narrow',sans-serif;
}

/* Mobile word-slot type scale \u2014 widen the IS peak so hierarchy survives.
   Reader feedback: font was reading "thin" on mobile. Bumped sizes up
   10\u201315% and added font-weight:900 + stretched letter-spacing to make
   the stamp feel heavier in each word. */
@media (max-width: 480px) {
  .word-slot { font-weight: 900; font-stretch: 110%; }
  #w-then { font-size: clamp(54px, 13vw, 96px);  }
  #w-who  { font-size: clamp(86px, 20vw, 140px); }
  #w-is   { font-size: clamp(128px,30vw, 210px); }
  #w-the  { font-size: clamp(68px, 15vw, 116px); }
  #w-goat { font-size: clamp(64px, 14vw, 112px); }
}
.word-slot .ltr      { display:inline-block; will-change:transform,opacity; }
.word-slot .wipe-wrap{ display:inline-block; will-change:clip-path; }
#w-then { font-size:clamp(52px,10vw,140px);  color:#1A1614; align-items:flex-start; padding-top:clamp(32px,5vh,64px);       transform-origin:50% 5%;  }
#w-who  { font-size:clamp(68px,13vw,185px);  color:#1A1614; align-items:flex-start; padding-top:clamp(120px,27vh,280px);    transform-origin:50% 27%; }
#w-is   { font-size:clamp(88px,17vw,240px);  color:#1A1614;                          transform-origin:50% 50%; }
#w-the  { font-size:clamp(60px,11vw,155px);  color:#1A1614; align-items:flex-start; padding-top:clamp(400px,68vh,700px);   transform-origin:50% 68%; }
#w-goat { font-size:clamp(56px,10vw,145px);  color:#C9920A; align-items:flex-end;   padding-bottom:clamp(32px,5vh,64px);   transform-origin:50% 95%; }

/* ═══════════════════════════════════════════
   KEEP-SCROLLING HINT
   One global hint pinned to the viewport bottom. mix-blend-mode:
   difference auto-flips it between dark-on-cream and light-on-dark
   so it stays legible across every section's background (hero cream,
   intro cream↔club, chart dark). Hidden via JS once the vote
   section enters the viewport (the bottom of the experience).
═══════════════════════════════════════════ */
.keep-scrolling {
  position:fixed;
  bottom:clamp(14px, 2.5vh, 28px);
  left:50%;
  transform:translateX(-50%);
  font-family:'JetBrains Mono', ui-monospace, monospace;
  font-size:10px;
  letter-spacing:.26em;
  font-weight:600;
  text-transform:uppercase;
  color:#FFFFFF;
  mix-blend-mode:difference;
  opacity:.72;
  z-index:9999;
  pointer-events:none;
  white-space:nowrap;
  transition:opacity .3s ease;
}
.keep-scrolling.hide { opacity:0; }

/* ═══════════════════════════════════════════
   BRIDGE — #F5F1EB → #07090C
═══════════════════════════════════════════ */
.section-bridge {
  height:12vh;
  background:linear-gradient(to bottom, #F5F1EB 0%, #07090C 100%);
  position:relative; z-index:1;
}

/* ═══════════════════════════════════════════
   SECTION 03 — CHART
   All var() references replaced with direct hex.
   No :root, no html/body height, no body font-family.
═══════════════════════════════════════════ */
.chart-section { position:relative; background:#07090C; }
.table-header {
  position:sticky; top:0; z-index:50;
  /* No background — reader feedback was that the opaque fill clipped
     the tops of the rows scrolling under it. The portraits are large
     and high-contrast on their own, they read fine against the rows. */
  background:transparent;
  padding:clamp(14px,2.2vh,24px) clamp(20px,4vw,64px);
  display:grid; grid-template-columns:clamp(130px,16vw,210px) repeat(5,1fr);
  gap:0 6px; align-items:center;
  /* sticky works because .table-body is the scroll container */
  pointer-events:none;
}
.player-head { display:flex; flex-direction:column; align-items:center; gap:5px; }
.portrait-ring {
  width:clamp(44px,5.5vw,68px); height:clamp(44px,5.5vw,68px);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:2px solid rgba(242,237,228,.1);
  transition:border-color .6s ease,box-shadow .6s ease; overflow:hidden; position:relative;
}
.initials { font-size:clamp(12px,1.3vw,15px); letter-spacing:.04em; position:relative; z-index:1; }
.player-name-label {
  font-family:'Space Grotesk',system-ui,sans-serif; font-size:clamp(13px,1vw,15px);
  font-weight:600; letter-spacing:.1em; color:rgba(242,237,228,.72); text-transform:uppercase; text-align:center;
}
.phead-rivers.lit .portrait-ring { border-color:rgba(0,133,202,.75); box-shadow:0 0 14px rgba(0,133,202,.4),0 0 32px rgba(0,133,202,.15); }
.trace-beam { position:absolute; left:clamp(20px,4vw,64px); top:0; bottom:0; width:1px; pointer-events:none; z-index:1; }
.trace-fill { position:absolute; top:0; left:0; width:1px; height:0%; background:linear-gradient(to bottom,transparent 0%,rgba(200,16,46,.55) 8%,rgba(200,16,46,.32) 85%,transparent 100%); }
.table-body { padding:clamp(24px,4vh,48px) clamp(20px,4vw,64px); position:relative; }
.cat-row {
  display:grid; grid-template-columns:clamp(130px,16vw,210px) repeat(5,1fr);
  gap:0 6px; padding:clamp(36px,6vh,72px) 0;
  border-bottom:1px solid rgba(242,237,228,.04); position:relative; align-items:start;
}

/* Tablet — allow title wrapping + hyphenation on long labels */
@media (max-width: 768px) {
  .cat-title-el { hyphens:auto; -webkit-hyphens:auto; }
}

/* Mobile — drop the label column; row eyebrow ("01") still identifies each row.
   Reclaims ~130px for the 5 player cells. */
@media (max-width: 480px) {
  .table-header {
    grid-template-columns: repeat(5,1fr);
    padding:clamp(10px,2vh,16px) clamp(10px,3vw,16px);
  }
  .table-header > div:first-child { display:none; }
  .portrait-ring { width:clamp(44px,11vw,56px); height:clamp(44px,11vw,56px); }
  .initials { font-size:clamp(12px,3vw,16px); }
  .player-name-label { font-size:12px; letter-spacing:.08em; }
  .cat-row {
    grid-template-columns: repeat(5,1fr);
    padding: clamp(20px,3vh,36px) 0;
  }
  .cat-label-col {
    grid-column: 1 / -1;
    padding: 0 10px 10px;
  }
  .cat-eyebrow { font-size:12px; letter-spacing:.2em; }
  .cat-title-el { font-size: 15px; letter-spacing:.04em; }
  .table-body { padding: clamp(12px,2vh,20px) clamp(10px,3vw,16px); }
}
.cat-row::before {
  content:''; position:absolute; left:-4px; top:clamp(40px,6vh,68px);
  width:8px; height:8px; border-radius:50%;
  background:#C8102E; box-shadow:0 0 8px rgba(200,16,46,.65);
  opacity:0; transition:opacity .3s ease;
}
.cat-row.dotted::before { opacity:1; }
.cat-label-col { padding-right:14px; padding-top:2px; }
.cat-eyebrow { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:clamp(12px,.82vw,13px); letter-spacing:.18em; color:#C8102E; text-transform:uppercase; opacity:.75; margin-bottom:6px; font-weight:500; }
.cat-title-el { font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700; font-size:clamp(15px,1.45vw,19px); letter-spacing:.04em; color:#F2EDE4; text-transform:uppercase; line-height:1.2; min-height:clamp(22px,2.6vw,38px); word-break:break-word; }
.cat-cursor { display:inline-block; width:2px; height:.8em; background:#C8102E; margin-left:3px; vertical-align:middle; animation:blink .7s step-end infinite; }
@keyframes blink { 50%{opacity:0;} }
.cat-sub-el { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:clamp(10px,.82vw,11px); letter-spacing:.08em; color:rgba(242,237,228,.5); text-transform:uppercase; margin-top:7px; line-height:1.55; font-weight:400; }
.p-cell {
  border:1px solid rgba(242,237,228,.06); border-radius:3px;
  padding:clamp(10px,1.5vh,18px) clamp(6px,.9vw,12px); min-height:clamp(76px,10vh,120px);
  display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
  position:relative; overflow:hidden; background:transparent;
  transition:background .55s ease,border-color .55s ease,box-shadow .55s ease;
  opacity:0;
}
.cell-val { font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700; font-size:clamp(22px,2.9vw,46px); letter-spacing:-.01em; color:rgba(242,237,228,.92); line-height:1.05; transition:color .45s ease; max-width:100%; }
.cell-val.sm { font-weight:600; font-size:clamp(15px,1.8vw,26px); letter-spacing:.02em; max-width:100%; }
.cell-val.xs { font-family:'Space Grotesk',system-ui,sans-serif; font-weight:500; font-size:clamp(13px,1.15vw,15px); letter-spacing:.01em; line-height:1.4; overflow-wrap:break-word; max-width:100%; text-transform:none; }
.cell-flavor { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:clamp(11px,1vw,12px); letter-spacing:.06em; color:rgba(242,237,228,.72); text-transform:uppercase; margin-top:6px; line-height:1.55; font-weight:400; opacity:0; transition:opacity .4s ease; overflow-wrap:break-word; max-width:100%; }
/* Hairline-separated list for rich cells (Page's life-after-football).
   Reader feedback: bullets read as clutter; plain lines separated by a
   thin rule are easier to scan. Matches the mobile treatment. */
.cell-flavor-list {
  list-style:none; padding:0; margin:8px 0 0 0;
  display:flex; flex-direction:column; gap:0;
  opacity:0; transition:opacity 1.2s ease;
  max-width:100%;
}
.cell-flavor-list.in { opacity:1; }
.cell-flavor-list li {
  font-family:'JetBrains Mono',ui-monospace,monospace;

  line-height:1.45; font-weight:400;
  padding:5px 0;
  border-bottom:1px solid rgba(242,237,228,.14);
}
.cell-flavor-list li:last-child { border-bottom:none; }
.cell-flavor-list li::before { content:none; }
.cg-gold .cell-flavor-list li { color:rgba(255,250,230,.95); }
.cg-gold .cell-flavor-list li::before { color:rgba(255,250,230,.8); }
.cg-gold   { background:rgba(168,120,0,.95)!important;  border-color:rgba(255,200,40,.85)!important; }
.cg-gold   .cell-val { color:#FFFDF5; text-shadow:0 1px 2px rgba(0,0,0,.35); } .cg-gold .cell-flavor { color:rgba(255,250,230,.88); }
.cg-faint  { background:rgba(34,140,60,.13)!important;  border-color:rgba(34,160,65,.2)!important; }
.cg-faint  .cell-val { color:rgba(242,237,228,.78); } .cg-faint .cell-flavor { color:rgba(242,237,228,.35); }
.cg-mid    { background:rgba(30,160,60,.26)!important;  border-color:rgba(30,160,60,.38)!important; }
.cg-mid    .cell-val { color:#A8EDBA; } .cg-mid .cell-flavor { color:rgba(168,237,186,.5); }
.cg-strong { background:rgba(18,180,60,.4)!important;   border-color:rgba(18,180,60,.55)!important; }
.cg-strong .cell-val { color:#6FEEA0; } .cg-strong .cell-flavor { color:rgba(111,238,160,.5); }
.cg-deep   { background:rgba(8,210,70,.46)!important;   border-color:rgba(8,220,80,.62)!important; box-shadow:0 0 20px rgba(8,220,80,.14)!important; }
.cg-deep   .cell-val { color:#3DFFAA; } .cg-deep .cell-flavor { color:rgba(61,255,170,.58); }
.cr-faint  { background:rgba(200,16,46,.09)!important;  border-color:rgba(200,16,46,.2)!important; }
.cr-faint  .cell-val { color:rgba(242,237,228,.42); }
.cr-deep   { background:rgba(200,16,46,.42)!important;  border-color:rgba(200,16,46,.62)!important; box-shadow:0 0 18px rgba(200,16,46,.12)!important; }
.cr-deep   .cell-val { color:#FF8080; } .cr-deep .cell-flavor { color:rgba(255,128,128,.55); }
@keyframes greenPulse   { 0%{box-shadow:0 0 20px rgba(8,220,80,.14);}  45%{box-shadow:0 0 55px rgba(8,220,80,.55),0 0 100px rgba(8,220,80,.22);}  100%{box-shadow:0 0 20px rgba(8,220,80,.14);} }
@keyframes greenBreathe { 0%,100%{box-shadow:0 0 20px rgba(8,220,80,.14);} 50%{box-shadow:0 0 42px rgba(8,220,80,.48),0 0 72px rgba(8,220,80,.18);} }
@keyframes redPulse     { 0%{box-shadow:0 0 18px rgba(200,16,46,.12);}  45%{box-shadow:0 0 50px rgba(200,16,46,.6),0 0 90px rgba(200,16,46,.22);}  100%{box-shadow:0 0 18px rgba(200,16,46,.12);} }
@keyframes goldPulse    { 0%{opacity:1;} 50%{opacity:.88;} 100%{opacity:1;} }
.cg-deep.pulse   { animation:greenPulse   1.5s ease-in-out; }
.cg-deep.breathe { animation:greenBreathe 3.2s ease-in-out infinite; }
.cg-gold.pulse   { animation:goldPulse 2.8s ease-in-out infinite; }
.cr-deep.pulse   { animation:redPulse     1.5s ease-in-out; }
.cell-late-label { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:clamp(11px,.9vw,12px); letter-spacing:.08em; text-transform:uppercase; margin-top:7px; line-height:1.4; color:#FF4D5E; font-weight:500; opacity:0; transition:opacity 1.6s ease; }
.cell-late-label.in { opacity:1; }

/* ─────────────────────────────────────────────
   MOBILE CHART LAYOUT (<= 768px)
   Switches .cat-row from 5-col grid to a vertical stack.
   Each .p-cell becomes a full-width row: [portrait] [name] [value+flavor].
   Color grading still applies — gold/green backgrounds now paint the
   whole row so readability wins over cramped-cell comparison.
───────────────────────────────────────────── */

/* Mobile-cell inner elements — hidden on desktop, shown on mobile */
.m-cell-header, .m-cell-body { display: contents; }
.m-cell-portrait, .m-cell-name, .m-cell-face { display: none; }

@media (max-width: 768px) {
  /* Hide the sticky 5-portrait header (we put portraits inline in each row) */
  .table-header { display: none; }

  /* Vertical row */
  .cat-row {
    display: flex !important;
    flex-direction: column;
    gap: 7px;
    padding: 18px 0 20px !important;
    border-bottom: 1px solid rgba(242,237,228,.08);
  }
  .cat-row::before { left: -2px; top: 24px; }
  .cat-label-col {
    padding: 0 4px 6px;
    /* Mobile: force the row title to render first (before any cells) */
    order: -1;
  }
  .cat-eyebrow { font-size: 11px; letter-spacing:.28em; margin-bottom: 4px; }
  .cat-title-el {
    font-size: 18px !important;
    letter-spacing: .04em !important;
    color: #F2EDE4;
    line-height: 1.25;
    min-height: 0 !important;
  }
  .cat-sub-el { font-size: 10px !important; margin-top: 4px; }

  /* Each cell becomes a horizontal row — portrait on left, name+body stacked to right */
  .p-cell {
    display: grid !important;
    grid-template-columns: 52px 1fr;
    align-items: center;
    gap: 12px;
    min-height: 0 !important;
    padding: 14px 14px !important;
    border-radius: 8px;
    border-width: 1px;
    text-align: left !important;
    position: relative;
    /* Mobile-only reorder: renderTable stamps --m-order per cell, and flex's
       `order` sorts them within the row. Default 99 keeps any unstamped cell
       at the bottom. Desktop ignores this (cells use grid-template-columns). */
    order: var(--m-order, 99);
  }

  /* Reveal inline portrait + name on mobile */
  .m-cell-header {
    display: contents;
  }
  .m-cell-body {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    text-align: left;
    min-width: 0;
    gap: 2px;
    grid-column: 2;
    grid-row: 2;
  }
  .m-cell-portrait {
    display: block;
    grid-column: 1;
    grid-row: 1 / span 2;
    width: 44px; height: 44px;
    flex-shrink: 0;
    align-self: center;
  }
  .m-cell-face {
    display: flex;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid;
    overflow: hidden;
    position: relative;
    align-items: center;
    justify-content: center;
  }
  .m-cell-face > svg,
  .m-cell-face > div,
  .m-cell-face > div > svg { width: 100%; height: 100%; display: block; }
  .m-cell-name {
    display: block;
    grid-column: 2;
    grid-row: 1;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: .92;
    margin-bottom: 2px;
  }

  /* Value + flavor: stacked on the right side of the portrait, left-justified */
  .cell-val {
    font-size: 24px !important;
    line-height: 1.1 !important;
    letter-spacing: -.005em;
    text-align: left;
    max-width: 62vw;
    word-break: break-word;
  }
  .cell-val.sm { font-size: 15px !important; letter-spacing: .01em; }
  .cell-val.xs {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 600;
    font-size: 13px !important;
    letter-spacing: .01em;
    line-height: 1.3 !important;
    text-transform: none;
  }
  .cell-flavor {
    font-size: 11px !important;
    letter-spacing: .04em;
    margin-top: 3px !important;
    text-align: left;
    line-height: 1.45;
    max-width: 62vw;
    color: rgba(242,237,228,.78) !important;
  }
  /* Flavor list (Page's life-after accolades, and any future row) —
     each entry on its own line with a subtle bullet marker. Right-aligned
     so it reads with the rest of the mobile-body. */
  /* Page's life-after-football accolades — each on its own line, separated
     by a hairline rule so they read as distinct facts, not a bullet dump. */
  .cell-flavor-list {
    list-style: none;
    padding: 0;
    margin: 5px 0 0 0;
    text-align: left;
    max-width: 64vw;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .cell-flavor-list li {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .03em;
    color: rgba(255,240,180,.92);
    line-height: 1.4;
    text-transform: uppercase;
    font-weight: 400;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,215,0,.28);
  }
  .cell-flavor-list li:last-child { border-bottom: none; }
  .cell-flavor-list li::before { content: none; }
  .cell-late-label {
    font-size: 11px !important;
    letter-spacing: .08em;
    margin-top: 5px;
    text-align: left;
  }

  /* On mobile the cell is pre-revealed (opacity:1) — no scroll-scrub
     clip-path. revealRowMobile() handles entry via GSAP. */
  .p-cell { opacity: 0; }

  /* Gold cards: deep amber background + light cream text. An earlier pass
     used dark text on bright yellow, which reader feedback flagged as hard
     to scan. Inverting to light-on-amber gives a premium, clearly legible
     treatment with a consistent hierarchy against the dark page. */
  .cg-gold   { background:rgba(168,120,0,.95)!important; border-color:rgba(255,200,40,.85)!important; box-shadow: inset 3px 0 0 rgba(255,215,0,1); }
  .cg-gold .m-cell-name { color: #FFF7CC !important; opacity: .95; }
  .cg-gold .cell-val    { color: #FFFDF5 !important; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .cg-gold .cell-flavor { color: rgba(255,250,230,.88) !important; }
  .cg-gold .cell-flavor-list li { color: rgba(255,250,230,.95); border-bottom-color: rgba(255,240,200,.25); }
  .cg-deep   { box-shadow: inset 3px 0 0 rgba(8,220,80,.85), 0 0 20px rgba(8,220,80,.14)!important; }
  .cg-strong { box-shadow: inset 3px 0 0 rgba(18,180,60,.7); }
  .cg-mid    { box-shadow: inset 3px 0 0 rgba(30,160,60,.5); }
  .cg-faint  { box-shadow: inset 3px 0 0 rgba(34,160,65,.3); }
  .cr-deep   { box-shadow: inset 3px 0 0 rgba(200,16,46,.85), 0 0 18px rgba(200,16,46,.12)!important; }

  /* Gold pulse: subtle opacity breathe, no box-shadow flicker */
  .cg-gold.pulse { animation: goldPulse 2.8s ease-in-out infinite; }

  /* Trace beam removed on mobile to free horizontal space */
  .trace-beam { display: none; }

  /* Body padding on mobile — tighter */
  .table-body { padding: 16px 14px !important; }
}

/* Logan-Paul-past reveal state: cell goes black with a subtle red accent,
   and the late label (Logan Paul Podcast Guest) fades in red.
   Works on both desktop + mobile (triggered by scroll-past). */
.p-cell.lp-reveal {
  background: #0B0C0E !important;
  border-color: rgba(200,16,46,.32) !important;
  box-shadow: inset 3px 0 0 rgba(200,16,46,.6) !important;
  transition: background .7s ease, border-color .7s ease, box-shadow .7s ease;
}
.p-cell.lp-reveal .cell-val { color: rgba(242,237,228,.6) !important; transition: color .7s ease; }
.p-cell.lp-reveal .cell-flavor { color: rgba(242,237,228,.35) !important; transition: color .7s ease; }
.p-cell.lp-reveal .cell-late-label {
  color: #FF4D5E;
  letter-spacing: .14em;
}

/* Keep the <=480px header fallback (since header is now display:none, but
   override the old grid rules that tried to squash into 5-col). */
@media (max-width: 480px) {
  .cat-row { grid-template-columns: none !important; }
  .cat-label-col { grid-column: auto !important; }
}

/* ─────────────────────────────────────────────
   SECTION 03b — CHART SUMMARY
   Highlight-only grid that sits between the chart and the vote.
   Portraits on top row, colored dots below showing only the
   gold / strong-green / deep-red / Brady-red cells.
───────────────────────────────────────────── */
.chart-summary {
  background: #07090C;
  position: relative;
  min-height: 80vh;
  min-height: 80svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(40px, 8vh, 96px) clamp(16px, 4vw, 64px);
  overflow: hidden;
  /* Top-fade separator from the chart above */
  border-top: 1px solid rgba(242,237,228,.05);
}
.csum-inner {
  width: 100%;
  max-width: 820px;
  display: flex;
  flex-direction: column;
  gap: clamp(20px, 3vh, 40px);
}
.csum-portraits {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: clamp(8px, 2vw, 18px);
  align-items: end;
}
.csum-portrait {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 0;
  transform: translateY(-14px);
  will-change: opacity, transform;
}
.csum-portrait.in {
  opacity: 1;
  transform: translateY(0);
  transition: opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
}
.csum-portrait-ring {
  width: clamp(44px, 11vw, 76px);
  height: clamp(44px, 11vw, 76px);
  border-radius: 50%;
  border: 1.5px solid;
  overflow: hidden;
  position: relative;
  background: #07090C;
}
.csum-portrait-ring > div,
.csum-portrait-ring > div > svg,
.csum-portrait-ring > svg {
  width: 100%;
  height: 100%;
  display: block;
}
.csum-portrait-name {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: clamp(9px, 1.1vw, 11px);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(242,237,228,.55);
  text-align: center;
  white-space: nowrap;
}

/* Grid: one column per player, one row per chart-row, with only highlight
   cells rendered as visible dots. Empty rows stay as quiet spacers. */
.csum-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: clamp(6px, 1.2vw, 10px);
}
.csum-cell {
  aspect-ratio: 1 / 1;
  width: 100%;
  max-width: clamp(30px, 7vw, 56px);
  border-radius: 3px;
  justify-self: center;
  background: transparent;
  border: 1px solid rgba(242,237,228,.04);
  opacity: 0;
  transform: scale(.6);
  transition: opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1),
              background-color .45s ease, border-color .45s ease, box-shadow .45s ease;
  will-change: opacity, transform;
}
.csum-cell.empty {
  border-color: rgba(242,237,228,.03);
}
.csum-cell.in {
  opacity: 1;
  transform: scale(1);
}
.csum-cell.empty.in { opacity: .35; }

/* FLIGHT state: summary cell is parked at its chart-cell origin via inline
   transform. While .flight is set (and .in is not) we keep it visible so
   the viewer sees it as the chart's own cell that's about to travel.
   Once .in is added, the transform is cleared and the cell animates home. */
.csum-cell.flight {
  opacity: 1;
  /* transition is controlled from JS (transition:none during setup, then
     the release transition). z-index raises it over neighboring cells so
     flight paths don't clip behind. */
  z-index: 10;
  position: relative;
}
.csum-cell.flight.in { z-index: 1; }

/* Chart cell that has "handed off" its identity to the summary — dims on
   the donor side so the summary cell looks like the one that traveled. */
.p-cell.csum-handed {
  transition: opacity .5s ease, filter .5s ease;
  opacity: .35;
  filter: saturate(.5);
}
/* Brief flash at launch — even off-screen, any visible tail of the chart
   gives a quick visual cue that something just left that cell. */
@keyframes csumFlashPulse {
  0%   { box-shadow: inset 0 0 0 1px rgba(255,215,0,0); }
  40%  { box-shadow: inset 0 0 0 1px rgba(255,215,0,.85), 0 0 22px rgba(255,215,0,.55); }
  100% { box-shadow: inset 0 0 0 1px rgba(255,215,0,0); }
}
.p-cell.csum-flash {
  animation: csumFlashPulse .22s ease-out 1;
}

/* Portrait "landed" — subtle vertical squish/bounce when it reaches its spot */
@keyframes csumPortraitLand {
  0%   { transform: translateY(0) scaleY(1) scaleX(1); }
  25%  { transform: translateY(3px) scaleY(.92) scaleX(1.05); }
  55%  { transform: translateY(-2px) scaleY(1.04) scaleX(.98); }
  100% { transform: translateY(0) scaleY(1) scaleX(1); }
}
.csum-portrait.landed .csum-portrait-ring {
  animation: csumPortraitLand .5s cubic-bezier(.3,1.3,.5,1) 1;
  transform-origin: 50% 100%;
}

/* Highlight color variants — echo the chart's color grading */
.csum-cell.is-gold   { background: rgba(255,200,0,.78);  border-color: rgba(255,210,40,.95); box-shadow: 0 0 14px rgba(255,215,0,.22); }
.csum-cell.is-deep   { background: rgba(8,210,70,.55);   border-color: rgba(8,220,80,.72); box-shadow: 0 0 14px rgba(8,220,80,.2); }
.csum-cell.is-strong { background: rgba(18,180,60,.55);  border-color: rgba(18,180,60,.75); box-shadow: 0 0 10px rgba(18,180,60,.18); }
.csum-cell.is-mid    { background: rgba(30,180,75,.42);  border-color: rgba(30,180,75,.6);  box-shadow: 0 0 8px rgba(30,180,75,.14); }
.csum-cell.is-faint  { background: rgba(34,160,65,.22);  border-color: rgba(34,160,65,.4); }
.csum-cell.is-red    { background: rgba(200,16,46,.48);  border-color: rgba(200,16,46,.68); box-shadow: 0 0 14px rgba(200,16,46,.2); }

/* Subtle gold breathe on the GOLD cells only — matches the chart vocabulary */
@keyframes csumGoldBreathe { 0%,100%{box-shadow:0 0 14px rgba(255,215,0,.18);} 50%{box-shadow:0 0 30px rgba(255,215,0,.5);} }
.csum-cell.is-gold.in { animation: csumGoldBreathe 3s ease-in-out infinite; animation-delay: .6s; }

@media (max-width: 480px) {
  .chart-summary { padding: 40px 16px 56px; min-height: 70svh; }
  .csum-inner { gap: 18px; }
  .csum-grid { gap: 4px; }
  .csum-cell { max-width: 38px; }
}

.replay-hint {
  position:fixed; bottom:18px; right:20px;
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:.18em;
  color:rgba(242,237,228,.55); text-transform:uppercase;
  z-index:999; cursor:pointer; transition:color .2s, background .2s;
  padding:12px 16px; min-height:44px; min-width:44px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(7,9,12,.4); border:1px solid rgba(242,237,228,.15); border-radius:4px;
  backdrop-filter:blur(6px);
}
.replay-hint:hover { color:rgba(242,237,228,.9); background:rgba(7,9,12,.7); }
.replay-hint:focus-visible { outline:2px solid rgba(242,237,228,.7); outline-offset:3px; }


/* ═══════════════════════════════════════════
   SECTION 04 — VOTE
═══════════════════════════════════════════ */
.vote-section {
  background:#07090C;
  position:relative;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ── State containers ── */
.vote-state, .celebration-state, .results-state {
  display:none;
  flex-direction:column;
  align-items:center;
  width:100%;
  min-height:100vh;
}
.vote-state.active, .celebration-state.active, .results-state.active { display:flex; }

/* ── VOTE STATE ── */
.vote-header {
  text-align:center;
  padding:clamp(40px,7vh,80px) clamp(16px,4vw,48px) clamp(16px,2.5vh,30px);
  z-index:2;
}
.vote-title {
  font-size:clamp(42px,9vw,120px);
  letter-spacing:.06em;
  color:#F2EDE4;
  text-transform:uppercase;
  line-height:1;
}
.vote-subhead {
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:clamp(12px,1.1vw,13px);
  letter-spacing:.18em;
  color:rgba(242,237,228,.42);
  text-transform:uppercase;
  margin-top:clamp(8px,1.5vh,16px);
}

/* Circle layout container (landscape/wide) — height set by JS */
.vote-orbit-wrap {
  position:relative;
  width:100%;
  flex-shrink:0;
  display:none;
}
.vote-orbit-center { position:absolute; inset:0; }

/* Grid layout (portrait/mobile)
   5 players in a 6-cell grid: row 1 = Rivers, Alexander, Payton (3 cols)
   row 2 = Page, Brady (2 cells, centered). We use 6 columns and span 2
   per card so the 2nd row naturally centers via start/end offsets.
   The scrollable vote section fills available height with centered content
   and a large portrait up top so the layout feels intentional on tall
   phones rather than leaving a big empty area below Brady. */
.vote-grid {
  display:grid;
  grid-template-columns:repeat(6, 1fr);
  gap:clamp(14px, 3.5vw, 28px);
  padding:clamp(14px,3vh,32px) clamp(20px,6vw,56px);
  width:100%;
  max-width:560px;
  align-content:center;
}
.vote-grid .vote-card-grid { grid-column: span 2; justify-self:center; }
/* Row 2 — Page (col 2-4) and Brady (col 4-6): centers the pair under row 1 */
.vote-grid .vote-card-grid:nth-child(4) { grid-column: 2 / span 2; }
.vote-grid .vote-card-grid:nth-child(5) { grid-column: 4 / span 2; }
/* When vote section is active on mobile, let it grow tall enough to center */
@media (max-width: 767px), (orientation: portrait) {
  .vote-section { min-height: 100dvh; padding-top: clamp(20px, 5vh, 60px); padding-bottom: clamp(40px, 10vh, 80px); justify-content: flex-start; }
  .vote-state.active { justify-content: flex-start; gap: clamp(24px, 5vh, 60px); }
  .vote-grid .vote-face-ring { width: clamp(100px, 28vw, 150px); height: clamp(100px, 28vw, 150px); }
  .vote-card-name { font-size: clamp(12px, 2.4vw, 14px); margin-top: clamp(8px, 1.5vh, 14px); }

  /* Results layout on mobile — remove the min-height:100vh floor on
     BOTH the vote-section and the results-state container so the
     section's actual height = content height. Without this, the
     container was always at least 100vh tall, which combined with
     the browser's URL-bar dynamic viewport math sometimes pushed the
     bottom of the leaderboard past the viewport edge and scroll
     would lock at the last section boundary before you could reach
     it. Letting content drive height ensures the whole thing fits. */
  .results-state.active {
    min-height: 0;
    padding-top: clamp(6px, 1vh, 14px);
    padding-bottom: clamp(10px, 1.5vh, 20px);
    justify-content: flex-start;
  }
  .vote-section {
    padding-top: clamp(4px, 1vh, 12px);
    padding-bottom: clamp(8px, 1.5vh, 20px);
  }
  /* Close up the gap between the chart-summary (graph above) and the
     vote-section — previously ~120px of combined padding on mobile. */
  .chart-summary { padding: clamp(16px, 3vh, 36px) 16px clamp(8px, 1.5vh, 18px); min-height: auto; }

  .vote-results-sticker-top {
    margin-bottom: 2px;
  }
  .vote-results-sticker-top .sticker-placeholder {
    /* Hard cap at ~22vh so the Brady row at the bottom of the
       leaderboard stays on-screen without zooming out. Each 2vh taken
       off the sticker gains the leaderboard a row of breathing room. */
    width:  clamp(100px, 30vw, 160px);
    height: clamp(130px, 22vh, 200px);
  }
  .vote-results-sticker-name { margin-top: 2px; font-size: 9px; }
  .vote-leaderboard {
    /* Cancel the desktop margin-top:auto (which pushed the leaderboard
       to the bottom of a 100vh flex column — on mobile that created a
       big gap between sticker and leaderboard). Stack naturally. */
    margin-top: 0;
    margin-bottom: 0;
    gap: 6px;
  }
  .vote-lb-row {
    grid-template-columns: 32px 1fr 28px;
    gap: 8px;
  }
  .vote-lb-face { width: 32px; height: 32px; border-width: 1.5px; }
  .vote-lb-name { font-size: 11px; letter-spacing: .1em; }
  .vote-lb-pill { font-size: 8px; padding: 2px 6px; letter-spacing: .1em; }
  .vote-bar-track { height: 5px; }
  .vote-lb-count { font-size: 12px; }
}

.vote-center-preview {
  /* Image-based hover preview: on hover, a large stylized illustration of
     the focused player appears at the orbit center with an accent-colored
     radial halo. Names live on the orbit cards themselves — this element
     is purely the hero portrait. */
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%, -50%) scale(0.92);
  width:clamp(240px,36vmin,460px);
  height:clamp(240px,36vmin,460px);
  pointer-events:none;
  opacity:0;
  transition:opacity 0.25s ease, transform 0.35s cubic-bezier(.2,.8,.2,1);
  z-index:10;
  display:flex; align-items:center; justify-content:center;
}
.vote-center-preview::before {
  /* Accent-color radial glow behind the portrait */
  content:'';
  position:absolute; inset:-8%;
  background: radial-gradient(circle at 50% 50%,
    var(--preview-accent,rgba(255,255,255,.45)) 0%,
    transparent 62%);
  opacity:.55;
  filter:blur(8px);
  z-index:0;
}
.vote-center-preview img {
  position:relative; z-index:1;
  width:100%; height:100%;
  object-fit:contain;
  filter:drop-shadow(0 12px 28px rgba(0,0,0,.55));
}
.vote-center-preview.visible {
  opacity:1;
  transform:translate(-50%, -50%) scale(1);
}

/* Show orbit on wide/landscape */
@media (min-width:1024px) {
  .vote-orbit-wrap { display:block; }
  .vote-grid       { display:none;  }
}
@media (min-width:768px) and (orientation:landscape) {
  .vote-orbit-wrap { display:block; }
  .vote-grid       { display:none;  }
}

/* Brady is a secret option — treated like the others visually. Click handler
   silently routes to riversgoat.com (see handleVoteClick). */

/* Vote card */
.vote-card {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(6px,1vh,12px);
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  min-width:44px;
  min-height:44px;
  padding:6px;
}
.vote-card:hover  { transform:scale(1.08); }
.vote-card:active { transform:scale(0.95); }
.vote-card:focus-visible {
  outline: 2px solid var(--vote-accent, rgba(242,237,228,.8));
  outline-offset: 6px;
  border-radius: 50%;
}

/* Circle card — upright, no rotation ever */
.vote-card-orbit {
  transition:transform .2s ease;
}
.vote-card-orbit:hover {
  transform:scale(1.12) !important;
}

/* Face ring */
.vote-face-ring {
  border-radius:50%;
  overflow:hidden;
  border:3px solid rgba(255,255,255,.15);
  transition:border-color .25s,box-shadow .25s;
  flex-shrink:0;
}
.vote-face-ring .face-svg { display:block; width:100%; height:100%; }

/* Orbit face size */
.vote-card-orbit .vote-face-ring {
  width:clamp(72px,10vmin,120px);
  height:clamp(72px,10vmin,120px);
}
/* Grid — tablet */
@media (min-width:600px) {
  .vote-card-grid .vote-face-ring {
    width:clamp(72px,15vw,108px);
    height:clamp(72px,15vw,108px);
  }
}
/* Grid — mobile: larger faces, fill available width */
@media (max-width:599px) {
  .vote-card-grid .vote-face-ring {
    width:clamp(80px, 22vw, 130px);
    height:clamp(80px, 22vw, 130px);
  }
}
.vote-card:hover .vote-face-ring {
  border-color:var(--vote-accent);
  box-shadow:0 0 18px var(--vote-accent),0 0 40px var(--vote-accent);
}
.vote-card-name {
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:clamp(12px,1.1vw,13px);
  letter-spacing:.2em;
  color:rgba(242,237,228,.65);
  text-transform:uppercase;
  text-align:center;
}

/* ── CELEBRATION STATE ── */
.celebration-state { justify-content:center; align-items:center; perspective: 900px; }

/* Base sticker-placeholder (shared by celebration + results) */
.sticker-placeholder {
  border-radius:0;
  overflow:visible;
  background:none !important;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  flex-shrink:0;
  width:clamp(200px,38vmin,380px);
  height:clamp(260px,50vmin,500px);
}

.vote-celeb-wrap {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(14px,2.5vh,30px);
  position: relative;
}

/* Sticker shell hosts sweep + image + particles. Applies 3D tilt via custom
   props (set by JS mousemove on desktop only). */
.celeb-sticker-shell {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-style: preserve-3d;
  transform: rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition: transform .25s cubic-bezier(.2,.8,.2,1);
  width: clamp(200px,38vmin,380px);
  height: clamp(260px,50vmin,500px);
}
.celeb-sticker-shell .sticker-placeholder {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
}

/* Radial team-color sweep — behind the sticker. On .burst, expands and fades
   twice (ripple). Uses the --accent custom prop set by JS. */
.celeb-sweep {
  --accent: #FFB612;
  position: absolute;
  inset: 50% auto auto 50%;
  width: 40px; height: 40px;
  margin: -20px 0 0 -20px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  opacity: 0;
  pointer-events: none;
  z-index: 1;
}
.celeb-sweep.burst {
  animation: celebSweep 1.1s cubic-bezier(.2,.7,.2,1) 1;
}
.celeb-sweep.burst::before,
.celeb-sweep.burst::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--accent);
}
.celeb-sweep.burst::before { animation: celebSweep 1.4s cubic-bezier(.2,.7,.2,1) .18s 1; }
.celeb-sweep.burst::after  { animation: celebSweep 1.7s cubic-bezier(.2,.7,.2,1) .36s 1; }
@keyframes celebSweep {
  0%   { transform: scale(1);    opacity: .8; }
  60%  { opacity: .3; }
  100% { transform: scale(22);   opacity: 0; }
}

/* Particles burst — each particle reads its own --dx/--dy/--sz/--dur/--delay */
.celeb-particles {
  position: absolute;
  inset: 50% auto auto 50%;
  width: 0; height: 0;
  pointer-events: none;
  z-index: 3;
}
.celeb-particle {
  position: absolute;
  left: 0; top: 0;
  width: var(--sz, 4px);
  height: var(--sz, 4px);
  margin-left: calc(var(--sz,4px) / -2);
  margin-top:  calc(var(--sz,4px) / -2);
  border-radius: 50%;
  opacity: 0;
  will-change: transform, opacity;
  animation: celebParticle var(--dur, .7s) cubic-bezier(.15,.85,.35,1) var(--delay, 0s) 1 forwards;
  box-shadow: 0 0 6px currentColor;
}
@keyframes celebParticle {
  0%   { transform: translate(0,0) scale(1);    opacity: 1; }
  85%  { opacity: .9; }
  100% { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; }
}

/* Name — letters animate in individually. GSAP handles the actual tween;
   the span needs transform-style + backface for rotateX to look clean. */
.vote-celeb-name {

<script>
gsap.registerPlugin(ScrollTrigger);
/* GSAP's mobile scroll normalization — shields ScrollTrigger from the
   URL-bar animation jitter on touch devices. Without this, innerHeight
   returns intermediate values during URL bar retract, GSAP measures at
   one of them, and the pin locks at the wrong size until the user
   scrolls back (which forces a re-measure). Works best with pinType:
   'transform' (default on touch) — see GSAP docs "normalizeScroll". */
ScrollTrigger.normalizeScroll(true);

<!-- ── 01 HERO JS ── -->
<script>
;(function() {

  const notEl   = document.getElementById('not-text');
  const notWrap = document.querySelector('.line-not-wrap');
  const heroEl  = document.querySelector('.hero');
  let _notDropTl = null, _heroST = null, _impactFired = false, _notWrapH = 0, _notStartY = -600;

  /* ── Crown head-tracking ──
     HEAD_X / HEAD_Y are fractions of the Brady image's own dimensions,
     pointing at the center of his head. The function converts those into
     pixel positions inside #illo-wrap by accounting for object-fit:contain
     letterboxing, so the crown follows his head at every screen size. */
  var CROWN_HEAD_X = 0.435;
  var CROWN_HEAD_Y = 0.072;
  var CROWN_ROT    = -20.4;

  /* Brady SVG intrinsic dimensions — used as fallback when naturalWidth
     reports 0 (can happen with large SVGs in some browsers during initial load) */
  var BRADY_NATURAL_W = 301.68;
  var BRADY_NATURAL_H = 245.76;

  function positionCrownOnHead() {
    var img   = document.getElementById('hero-brady-img');
    var crown = document.getElementById('crown-svg');
    var box   = document.getElementById('illo-wrap');
    if (!img || !crown || !box) return;

    var nW = img.naturalWidth  || BRADY_NATURAL_W;
    var nH = img.naturalHeight || BRADY_NATURAL_H;
    var cW = box.offsetWidth,  cH = box.offsetHeight;
    if (!cW || !cH) return;
    var iAR = nW / nH;
    var cAR = cW / cH;
    var rW, rH, oX, oY;

    if (iAR > cAR) {               // image wider → letterbox top & bottom
      rW = cW;  rH = cW / iAR;
      oX = 0;   oY = (cH - rH) / 2;
    } else {                       // image taller → letterbox left & right
      rH = cH;  rW = cH * iAR;
      oX = (cW - rW) / 2;  oY = 0;
    }

    var headX = oX + CROWN_HEAD_X * rW;
    var headY = oY + CROWN_HEAD_Y * rH;
    crown.style.left = (headX - crown.offsetWidth  / 2) + 'px';
    crown.style.top  = (headY - crown.offsetHeight * 0.55) + 'px';
  }

  /* ── Goat image-relative positioning (same letterbox math) ── */
  var GOAT_X   = 0.589; // fraction across image — goat's left edge
  var GOAT_Y   = 0.200; // fraction down image  — goat's top edge

  function positionGoatOnImage() {
    var img  = document.getElementById('hero-brady-img');
    var goat = document.getElementById('hero-goat');
    var box  = document.getElementById('illo-wrap');
    if (!img || !goat || !box) return;

    var nW = img.naturalWidth  || BRADY_NATURAL_W;
    var nH = img.naturalHeight || BRADY_NATURAL_H;
    var cW = box.offsetWidth, cH = box.offsetHeight;
    if (!cW || !cH) return;
    var iAR = nW / nH, cAR = cW / cH;
    var rW, rH, oX, oY;
    if (iAR > cAR) { rW=cW; rH=cW/iAR; oX=0; oY=(cH-rH)/2; }
    else            { rH=cH; rW=cH*iAR; oX=(cW-rW)/2; oY=0; }

    goat.style.left = (oX + GOAT_X * rW) + 'px';
    goat.style.top  = (oY + GOAT_Y * rH) + 'px';
  }

  /* Expose for tuner and resize */
  window._crownHeadX  = function(v) { CROWN_HEAD_X = v; };
  window._crownHeadY  = function(v) { CROWN_HEAD_Y = v; };
  window._crownRot    = function(v) { CROWN_ROT    = v; };
  window._positionCrown = positionCrownOnHead;
  window._goatX = function(v) { GOAT_X = v; };
  window._goatY = function(v) { GOAT_Y = v; };
  window._positionGoat  = positionGoatOnImage;

  window.addEventListener('resize', function() {
    positionCrownOnHead();
    positionGoatOnImage();
  });

  function spawnParticles() {
    const crown = document.getElementById('crown-svg');
    const rect  = crown.getBoundingClientRect();
    const cx = rect.left + rect.width * .5, cy = rect.top + rect.height * .5;
    for (let i = 0; i < 10; i++) {
      const p = document.createElement('div'), sz = 3 + Math.random() * 4;
      p.className = 'particle';
      p.style.cssText = `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:${Math.random()>.4?'#D4AF37':'#F2EDE4'};opacity:1;`;
      document.body.appendChild(p);
      const angle = (Math.PI*2/10)*i + (Math.random()-.5)*.8, dist = 50 + Math.random()*90;
      gsap.to(p, { x:Math.cos(angle)*dist, y:Math.sin(angle)*dist-50, opacity:0,
        duration:.6+Math.random()*.5, ease:'power2.out', onComplete:()=>p.remove() });
    }
  }

  function shake() {
    var targets = ['#headline','#headline-lower'];
    targets.forEach(function(sel) {
      gsap.fromTo(sel, {x:0,y:0},
        {x:'random(-7,7)',y:'random(-3,3)', duration:.055, repeat:6, yoyo:true, ease:'none',
         onComplete:function(){ gsap.set(sel,{x:0,y:0}); }});
    });
  }

  /* ── IMPACT: fires when NOT passes the crown mid-fall ── */
  var _impactTl = null;
  function fireImpact() {
    if (_impactFired) return;
    _impactFired = true;
    shake();
    spawnParticles();
    notEl.classList.add('struck');

    if (_impactTl) _impactTl.kill();
    _impactTl = gsap.timeline();

    /* 1 — Crown tumbles bottom-left off screen */
    _impactTl.to('#crown-svg', {
      x: -300, y: 500,
      rotation: CROWN_ROT + 300,
      scale: 0.2, opacity: 0,
      duration: 0.9, ease: 'power2.in'
    }, 0);

    /* 2 — Brady crossfades to shocked via opacity on a pre-rendered
       duplicate img element. No .src swap → no layout recalc, no
       first-play stutter. Both images are rendered in the DOM at
       load time; only opacity changes. */
    _impactTl.to('#hero-brady-img',         { opacity: 0, duration: 0.22, ease: 'power1.inOut' }, 0.05);
    _impactTl.to('#hero-brady-img-shocked', { opacity: 1, duration: 0.22, ease: 'power1.inOut' }, 0.05);

    /* 3 — Illustration zooms into shocked face after NOT lands */
    _impactTl.to('#illo-wrap', {
      y: 40, scale: 2.2,
      transformOrigin: '50% 16%',
      duration: 0.85, ease: 'power2.out'
    }, 0.55);

    /* 4 — Scroll hint fades out, subtext fades in */
    _impactTl.to('#scroll-hint', { opacity: 0, duration: 0.2, ease: 'power1.in' }, 0);
    _impactTl.to('#subtext', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 1.1);
  }

  /* ── REVERSE IMPACT: user scrolled back — everything eases back smoothly ── */
  function reverseImpact() {
    if (!_impactFired) return;
    _impactFired = false;
    if (_impactTl) { _impactTl.kill(); _impactTl = null; }
    notEl.classList.remove('struck');
    gsap.killTweensOf(['#crown-svg','#subtext','#illo-wrap','#hero-brady-img']);

    var DUR = 0.4;
    gsap.to('#subtext',   { opacity: 0, duration: DUR * 0.5, ease: 'power1.in' });
    gsap.to('#illo-wrap', { y: 0, scale: 1, transformOrigin: '50% 28%', duration: DUR, ease: 'power2.out' });
    gsap.set('#hero-goat', { x: 0, opacity: 0 });

    /* Cross-fade back: shocked img out, normal img in. No src swap. */
    gsap.to('#hero-brady-img-shocked', { opacity: 0, duration: DUR, ease: 'power1.inOut' });
    gsap.to('#hero-brady-img',         { opacity: 1, duration: DUR, ease: 'power1.inOut' });
    positionCrownOnHead();
    positionGoatOnImage();
    gsap.set('#crown-svg', { x: 0, y: 0, rotation: CROWN_ROT, scale: 1 });
    gsap.to('#crown-svg',  { opacity: 1, duration: 0.3, ease: 'power2.out' });
  }

  function showInitial() {
    /* 1. Restore wrapper to measure natural height */
    gsap.set(notWrap, {clearProps:'height'});
    _notWrapH = notWrap.offsetHeight || 220;

    /* 2. Measure how far NOT's bottom is from the hero's top edge (at natural y:0),
          then set startY so NOT's bottom sits exactly at the hero top — fully clipped. */
    gsap.set(notEl, {y:0, opacity:0});
    const heroTop  = heroEl.getBoundingClientRect().top;
    const notBottom = notEl.getBoundingClientRect().bottom;
    _notStartY = -(notBottom - heroTop + 4); /* 4px gap above top edge */

    notEl.classList.remove('struck');
    gsap.set('#line-preamble', {opacity:0.82, y:0});
    gsap.set('#line-bottom',   {opacity:0.82, y:0});
    gsap.set(notWrap,          {height:0});               /* collapse → "The GOAT" sits under "Tom Brady is" */
    gsap.set(notEl,            {y:_notStartY, opacity:0}); /* just above hero top edge, invisible */
    gsap.set('#illo-wrap',   {opacity:1, y:0, scale:1, transformOrigin:'50% 28%'});
    gsap.set('#line-bottom', {y:0});
    gsap.set('#hero-goat',   {x:0, scaleX:1, opacity:0});
    gsap.set('#crown-svg',   {x:0, y:0, rotation:CROWN_ROT, opacity:1, scale:1});
    /* Both Brady images visible state: normal=opaque, shocked=transparent.
       Cross-fade approach replaces the old src-swap. */
    gsap.set('#hero-brady-img',         {opacity:1});
    gsap.set('#hero-brady-img-shocked', {opacity:0});
    positionCrownOnHead();
    gsap.set('#subtext',       {opacity:0});
    gsap.set('#scroll-hint',   {opacity:1});
    gsap.to('#scroll-hint',    {opacity:1, duration:0.3, ease:'power2.out'});
    _impactFired = false;
  }

  /* ── SCROLL-DRIVEN DROP ──
     Scrubs two things in sync:
       1. NOT falls from y:-380 (above hero) → y:0 with power2.in (gravity)
       2. .line-not-wrap height expands 0 → natural, pushing "The GOAT" down
     On landing (scroll > 350px), crown smacks off. ── */
  function _createHeroST() {
    if (_heroST)    { _heroST.kill();    _heroST    = null; }
    if (_notDropTl) { _notDropTl.kill(); _notDropTl = null; }

    const wrapH = _notWrapH || 220;

    const startY = _notStartY || -window.innerHeight;
    const LAND   = 0.35; /* progress where NOT fully lands */
    const IMPACT = 0.18; /* progress where NOT passes the crown — fires impact mid-fall */

    _notDropTl = gsap.timeline({paused:true})
      /* phase 1 (0 → LAND): NOT falls + wrapper expands */
      .fromTo(notEl,   {y:startY, opacity:0}, {y:0, opacity:1, ease:'power2.in', duration:LAND},   0)
      .fromTo(notWrap, {height:0},             {height:wrapH,  ease:'power2.in', duration:LAND},   0)
      /* phase 2 (LAND → 1.0): hold — hero stays pinned while impact animation
         (crown drop + shocked crossfade + illo zoom) plays out, then reads */
      .to({}, {duration:1 - LAND});

    _heroST = ScrollTrigger.create({
      trigger:             heroEl,
      start:               'top top',
      /* Mobile pin duration — +=900 was too short: a single thumb swipe
         (~600-800px) carried users past the impact AND the shocked-face
         hold before they could register it. +=1500 gives the impact beat
         (crown drop) room to land, then ~800px of "hold" where the
         shocked face sits on screen before the pin releases. Desktop
         scrolling is slower and can stay longer. */
      end:                 window.innerWidth <= 767 ? '+=1500' : '+=1800',
      pin:                 true,
      pinSpacing:          true,
      scrub:               true,
      animation:           _notDropTl,
      invalidateOnRefresh: true,
      /* Smooths the pin release into the intro section below. */
      anticipatePin:       1,
      onUpdate: self => {
        if (self.progress >= IMPACT && !_impactFired) fireImpact();
        else if (self.progress < IMPACT - 0.04 && _impactFired) reverseImpact();
      },
    });
  }

  /* Immediate visual-only reset (hides NOT etc.) without creating the ST */
  window._heroShowInitial = showInitial;

  /* Full reset: visual + new scroll trigger. Called inside replay's setTimeout
     so scroll has returned to top before the scrub ST is created. */
  window._heroReset = function() {
    showInitial();
    _createHeroST();
  };

  window.addEventListener('load', function() {
    showInitial();
    _createHeroST();
  });

})();
</script>

<!-- ── 02 INTRO JS ── -->
<script>
;(function() {

/* Renamed from PLAYERS to avoid conflict with chart's PLAYERS array */
const FACE_PLAYERS = {
  rivers:    { bg:'#001B3D', accent:'#FFB612', face:'#FFB612', iris:'#001B3D' },
  payton:    { bg:'#0B1F4E', accent:'#E87722', face:'#E87722', iris:'#001830' },
  alexander: { bg:'#002244', accent:'#69BE28', face:'#3A6B1A', iris:'#001830' },
  page:      { bg:'#3D1E6B', accent:'#B5985A', face:'#3D1E6B', iris:'#B5985A' },
  brady:     { bg:'#001840', accent:'#C8102E', face:'#C8102E', iris:'#001840' },
};

const COLUMNS = [
  { id:'col-fl', players:['rivers','payton','page','brady'],    speed:1.35 },
  { id:'col-nl', players:['alexander','rivers','payton'],       speed:0.82 },
  { id:'col-nr', players:['payton','page','alexander'],         speed:0.82 },
  { id:'col-fr', players:['page','alexander','rivers','brady'], speed:1.35 },
];

function buildFace(pid) {

}

COLUMNS.forEach(col => {

document.querySelectorAll('.face-svg').forEach((svg, i) => {
  const d = i*260 + Math.random()*500;
  function blink() {
    const lids = svg.querySelectorAll('.lid-l,.lid-r');

    setTimeout(()=>lids.forEach(l=>{l.style.transition='transform .11s ease-out';l.style.transform='scaleY(0)';}),85);
    setTimeout(blink, 2700+Math.random()*4200);
  }
  setTimeout(blink, d+Math.random()*1600);
  function look() {
    const dx=(Math.random()-.5)*5.5, dy=(Math.random()-.5)*2.8, dur=(300+Math.random()*280)+'ms';
    svg.querySelectorAll('.pupil-l,.iris-l,.pupil-r,.iris-r').forEach(el=>{
      el.style.transition=`transform ${dur} ease-in-out`; el.style.transform=`translate(${dx}px,${dy}px)`;
    });

      const t=(Math.random()-.5)*2.8;

      setTimeout(()=>{svg.style.transform='rotate(0deg)';},700);

    setTimeout(look, 1200+Math.random()*1900);

  setTimeout(look, d*.5+Math.random()*800);
