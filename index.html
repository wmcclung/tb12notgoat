/* ── WORD SETUP ── */
const wordEls = ['w-then','w-who','w-is','w-the','w-goat'].map(id=>document.getElementById(id));
const scatterCache = {};
const hasSeen = [false,false,false,false,false];

function getScatter(li) {
  if (!scatterCache[li]) {
    const dist=180+Math.random()*220, ang=Math.random()*Math.PI*2;
    scatterCache[li]={x:Math.cos(ang)*dist,y:Math.sin(ang)*dist*.5,rot:(Math.random()-.5)*280};
  }
  return scatterCache[li];
}

(()=>{ const el=document.getElementById('w-goat'); el.innerHTML=[...'GOAT'].map((ch,li)=>`<span class="ltr" data-li="${li}">${ch}</span>`).join(''); })();
(()=>{ const el=document.getElementById('w-the');  el.innerHTML=[...'THE'].map((ch,li)=>`<span class="ltr" data-li="${li}">${ch}</span>`).join(''); })();

/* ── SCROLL MATH ── */
const WORD_START=0.42, WORD_ZONE=0.11, ENTER_END=0.25, SIT_END=0.78, STAMP_SCALE=0.65, STAMP_OPACITY=0.60;

function clamp(v,a,b){return Math.min(Math.max(v,a),b);}
function eio(t){return t<.5?2*t*t:-1+(4-2*t)*t;}
function eout3(t){return 1-Math.pow(1-t,3);}
function bounceOut(t){if(t<0.72)return eout3(t/0.72);const b=(t-0.72)/0.28;return 1+Math.sin(b*Math.PI)*0.10*(1-b*0.5);}
function wordP(gp,i){return clamp((gp-WORD_START-i*WORD_ZONE)/WORD_ZONE,0,1);}

function animThen(wp,wH) {
  const el=wordEls[0];
  if(wp>=SIT_END) hasSeen[0]=true;
  if(wp>=1){gsap.set(el,{opacity:STAMP_OPACITY,scaleX:STAMP_SCALE,scaleY:STAMP_SCALE,y:0,filter:'none',transformOrigin:'50% 5%'});return;}
  if(wp>=SIT_END){const sp=clamp((wp-SIT_END)/0.22,0,1);gsap.set(el,{opacity:1-eio(sp)*(1-STAMP_OPACITY),scaleX:1-eio(sp)*(1-STAMP_SCALE),scaleY:1-eio(sp)*(1-STAMP_SCALE),y:0,filter:'none',transformOrigin:'50% 5%'});return;}
  if(wp>=ENTER_END){gsap.set(el,{opacity:1,scaleX:1,scaleY:1,y:0,filter:'none'});return;}
  if(wp>0){
    if(hasSeen[0]){const ep=wp/ENTER_END;gsap.set(el,{opacity:Math.min(ep/0.15,1)*STAMP_OPACITY,scaleX:STAMP_SCALE,scaleY:STAMP_SCALE,y:0,filter:'none',transformOrigin:'50% 5%'});}
    else{const ep=wp/ENTER_END;gsap.set(el,{opacity:Math.min(ep/0.2,1),y:-wH*0.18*(1-ep),scaleX:1,scaleY:1,filter:'none'});}
    return;
  }
  gsap.set(el,{opacity:0});
}

function animWho(wp,wH) {
  const el=wordEls[1];
  if(wp>=SIT_END) hasSeen[1]=true;
  const showFull =()=>gsap.set(el,{opacity:1,scaleX:1,scaleY:1,y:0,filter:'none',clipPath:'inset(0% 0% 0% 0%)'});
  const showStamp=()=>gsap.set(el,{opacity:STAMP_OPACITY,scaleX:STAMP_SCALE,scaleY:STAMP_SCALE,y:0,filter:'none',transformOrigin:'50% 27%',clipPath:'none'});
  if(wp>=1){showStamp();return;}
  if(wp>=SIT_END){const sp=clamp((wp-SIT_END)/0.22,0,1);gsap.set(el,{opacity:1-eio(sp)*(1-STAMP_OPACITY),scaleX:1-eio(sp)*(1-STAMP_SCALE),scaleY:1-eio(sp)*(1-STAMP_SCALE),y:0,filter:'none',transformOrigin:'50% 27%',clipPath:'none'});return;}
  if(wp>=ENTER_END){showFull();return;}
  if(wp>0){
    if(hasSeen[1]){const ep=wp/ENTER_END;gsap.set(el,{opacity:Math.min(ep/0.15,1)*STAMP_OPACITY,scaleX:STAMP_SCALE,scaleY:STAMP_SCALE,y:0,filter:'none',transformOrigin:'50% 27%',clipPath:'none'});return;}
    const ep=wp/ENTER_END, pct=Math.max(100*(1-eio(ep)),0);
    gsap.set(el,{opacity:Math.min(ep/0.15,1),scaleX:1,scaleY:1,y:0,filter:'none',clipPath:`inset(0% 0% ${pct.toFixed(1)}% 0%)`});return;
  }
  gsap.set(el,{opacity:0,clipPath:'inset(0% 0% 100% 0%)'});
}

function animIs(wp,wH) {
  const el=wordEls[2];
  if(wp>=SIT_END) hasSeen[2]=true;
  const showFull =()=>gsap.set(el,{opacity:1,scaleX:1,scaleY:1,y:0,filter:'none'});
  const showStamp=()=>gsap.set(el,{opacity:STAMP_OPACITY,scaleX:STAMP_SCALE,scaleY:STAMP_SCALE,y:0,filter:'none',transformOrigin:'50% 50%'});
  if(wp>=1){showStamp();return;}
  if(wp>=SIT_END){const sp=clamp((wp-SIT_END)/0.22,0,1);gsap.set(el,{opacity:1-eio(sp)*(1-STAMP_OPACITY),scaleX:1-eio(sp)*(1-STAMP_SCALE),scaleY:1-eio(sp)*(1-STAMP_SCALE),y:0,filter:'none',transformOrigin:'50% 50%'});return;}
  if(wp>=ENTER_END){showFull();return;}
  if(wp>0){
    if(hasSeen[2]){const ep=wp/ENTER_END;gsap.set(el,{opacity:Math.min(ep/0.15,1)*STAMP_OPACITY,scaleX:STAMP_SCALE,scaleY:STAMP_SCALE,y:0,filter:'none',transformOrigin:'50% 50%'});}
    else{
      const ep=wp/ENTER_END;
      let sc;
      if(ep<0.50){sc=1.60-eio(ep/0.50)*0.60;}else{const t=(ep-0.50)/0.50;sc=1.0-Math.sin(t*Math.PI)*0.12;}
      gsap.set(el,{opacity:Math.min(ep/0.08,1),scaleX:sc,scaleY:sc,y:0,filter:'none',transformOrigin:'50% 50%'});
    }
    return;
  }
  gsap.set(el,{opacity:0,scaleX:1.35,scaleY:1.35});
}

function animThe(wp,wH) {
  const el=wordEls[3], letters=el.querySelectorAll('.ltr');
  if(wp>=SIT_END) hasSeen[3]=true;
  const showFull =()=>{gsap.set(el,{opacity:1,scaleX:1,scaleY:1,y:0,filter:'none'});letters.forEach(l=>gsap.set(l,{x:0,opacity:1}));};
  const showStamp=()=>{gsap.set(el,{opacity:STAMP_OPACITY,scaleX:STAMP_SCALE,scaleY:STAMP_SCALE,y:0,filter:'none',transformOrigin:'50% 68%'});letters.forEach(l=>gsap.set(l,{x:0}));};
  const hideFar  =()=>{gsap.set(el,{opacity:0});letters.forEach((l,li)=>gsap.set(l,{x:li<2?-90:90}));};
  if(wp>=1){showStamp();return;}
  if(wp>=SIT_END){const sp=clamp((wp-SIT_END)/0.22,0,1);gsap.set(el,{opacity:1-eio(sp)*(1-STAMP_OPACITY),scaleX:1-eio(sp)*(1-STAMP_SCALE),scaleY:1-eio(sp)*(1-STAMP_SCALE),y:0,filter:'none',transformOrigin:'50% 68%'});letters.forEach(l=>gsap.set(l,{x:0}));return;}
  if(wp>=ENTER_END){showFull();return;}
  if(wp>0){
    if(hasSeen[3]){const ep2=wp/ENTER_END;gsap.set(el,{opacity:Math.min(ep2/0.15,1)*STAMP_OPACITY,scaleX:STAMP_SCALE,scaleY:STAMP_SCALE,y:0,filter:'none',transformOrigin:'50% 68%'});letters.forEach(l=>gsap.set(l,{x:0}));}
    else{
      const ep=wp/ENTER_END, dist=160;
      gsap.set(el,{opacity:Math.min(ep/0.15,1),scaleX:1,scaleY:1,y:0,filter:'none'});
      letters.forEach((l,li)=>{
        const lag=li===1?0.12:0, lp=clamp((ep-lag)/(1-lag),0,1), ease=eio(lp);
        const fromLeft=li<2, os=lp>0.82?Math.sin(((lp-0.82)/0.18)*Math.PI)*18:0;
        gsap.set(l,{x:(fromLeft?-dist:dist)*(1-ease)+(fromLeft?os:-os),opacity:Math.min(ep/0.10,1)});
      });
    }
    return;
  }
  hideFar();
}

let goatFallTl=null;
function fireGoatFallApart() {
  const el=wordEls[4], letters=el.querySelectorAll('.ltr');
  if(!letters.length) return;
  if(goatFallTl) goatFallTl.kill();
  goatFallTl=gsap.timeline();
  letters.forEach((l,li)=>{
    const s=getScatter(li), norm=Math.sqrt(s.x*s.x+s.y*s.y)||1, fd=160+li*40;
    goatFallTl.to(l,{x:(s.x/norm)*fd,y:(s.y/norm)*fd,rotation:s.rot*0.55,opacity:0,duration:.55,ease:'power2.in'},li*.08);
  });
  goatFallTl.to(el,{opacity:0,duration:.20},0.45);
}

function restoreGoat() {
  if(goatFallTl){goatFallTl.kill();goatFallTl=null;}
  const el=wordEls[4], letters=el.querySelectorAll('.ltr');
  gsap.set(el,{opacity:1,scaleX:1,scaleY:1,y:0,filter:'none'});
  letters.forEach(l=>gsap.set(l,{x:0,y:0,rotation:0,opacity:1}));
}

function animGoat(wp,wH) {
  const el=wordEls[4], letters=el.querySelectorAll('.ltr');
  if(!letters.length) return;
  const showFull=()=>{if(goatFallTl&&goatFallTl.isActive()) return;gsap.set(el,{opacity:1,scaleX:1,scaleY:1,y:0,filter:'none'});letters.forEach(l=>gsap.set(l,{x:0,y:0,rotation:0,opacity:1}));};
  if(wp>=SIT_END) hasSeen[4]=true;
  if(wp>=1||(wp>=SIT_END)){if(!goatFallTl||!goatFallTl.isActive()) showFull();return;}
  if(wp<=0){
    gsap.set(el,{opacity:0});letters.forEach((_,li)=>{const s=getScatter(li);gsap.set(_,{x:s.x,y:s.y,rotation:s.rot,opacity:0});});
    return;
  }
  if(wp>=ENTER_END){showFull();return;}
  if(hasSeen[4]){const ep=wp/ENTER_END;gsap.set(el,{opacity:Math.min(ep/0.15,1)*STAMP_OPACITY,scaleX:STAMP_SCALE,scaleY:STAMP_SCALE,y:0,filter:'none',transformOrigin:'bottom center'});letters.forEach(l=>gsap.set(l,{x:0,y:0,rotation:0,opacity:1}));return;}
  gsap.set(el,{opacity:Math.min(wp/ENTER_END/0.15,1),y:0,scaleX:1,scaleY:1,filter:'none'});
  letters.forEach((l,li)=>{
    const s=getScatter(li), lag=li*0.06, lp=clamp((wp/ENTER_END-lag*0.3)/0.7,0,1);
    const e=lp<0.5?4*lp*lp*lp:1-Math.pow(-2*lp+2,3)/2;
    gsap.set(l,{x:s.x*(1-e),y:s.y*(1-e),rotation:s.rot*(1-e),opacity:Math.min(lp/0.18,1)});
  });
}

/* ── DOMINO DROP ── */
let dropFired=false, dropTl=null;

function fireDropTransition() {
  if(dropFired) return;
  dropFired=true;

  const allCards=[...document.querySelectorAll('.cards-col .player-card')];
  dropTl=gsap.timeline({onComplete:()=>{
    const stamps=[wordEls[0],wordEls[1],wordEls[2],wordEls[3]];
    gsap.to(stamps,{opacity:0,y:-30,duration:.35,ease:'power2.in',stagger:.07,onComplete:fireGoatFallApart});
  }});
  dropTl.to(allCards,{y:window.innerHeight,opacity:0,duration:0.6,ease:'power2.in',stagger:{amount:0.3,from:'random'}},0);
}

function reverseDropTransition() {
  if(!dropFired) return;
  if(dropTl){dropTl.kill();dropTl=null;}
  dropFired=false;

  restoreGoat();
  gsap.to([wordEls[0],wordEls[1],wordEls[2],wordEls[3]],{opacity:STAMP_OPACITY,y:0,duration:.25,ease:'power2.out'});

  const allCards=[...document.querySelectorAll('.cards-col .player-card')];
  gsap.fromTo(allCards,{y:60,opacity:0},{y:0,opacity:1,duration:0.4,ease:'power2.out',stagger:{amount:0.25,from:'random'}});
}

/* ── SCROLL DRIVER ── */
const section=document.getElementById('intro-section');
const stageEl=document.getElementById('section-stage');
const centerCard=document.getElementById('center-card');
const colEls=[
  {el:document.getElementById('col-fl'),speed:1.35},
  {el:document.getElementById('col-nl'),speed:0.82},
  {el:document.getElementById('col-nr'),speed:0.82},
  {el:document.getElementById('col-fr'),speed:1.35},
];

/* onProgress drives all animation — called by ScrollTrigger.onUpdate */
function onProgress(gp) {
  /* Use the stage element's clientHeight (matches CSS 100vh) rather than
     window.innerHeight (visual viewport) so clip-path insets are computed
     relative to the card's actual rendered size. */
  const wH=stageEl.clientHeight||window.innerHeight, wW=window.innerWidth;

  /* PARTY PHASE: first 30% of intro scroll runs the Brady party payoff
     (dance → lightning → rocker + cards + lights → wind-down). Past
     that, effective progress (egp) drives the existing intro
     choreography (puppet shrink + word reveals + chart handoff). */
  const DWELL_END=0.30;
  const egp=clamp((gp-DWELL_END)/(1-DWELL_END),0,1);

  /* Drive the party sub-module (dance/rock scrub, lights, cards,
     lightning). gpLocal goes 0-1 across the party phase; negative/>1
     means we're outside the party and the update clears its state. */
  if (window._partyUpdate) window._partyUpdate(gp / DWELL_END);
  if (window._danceScrub)  window._danceScrub(gp);

  colEls.forEach(({el,speed})=>{
    if(!el) return;
    const startY=wH*1.15*speed, endY=-wH*0.12*speed, eased=eio(clamp(egp*1.1,0,1));
    el.style.transform=`translateY(${(startY-eased*(startY-endY)).toFixed(1)}px)`;
  });

  /* Puppet shrinks early (before "THEN" appears) so the words have a
     clean tiny-card visual to play against. Driven by egp (post-dwell). */
  const shrinkP=eio(clamp(egp/0.40,0,1)), cardR=clamp(wW*.07,44,96);
  const scaleT=(cardR*2)/wW, scale=1-shrinkP*(1-scaleT);
  const insetX=shrinkP*((wW-cardR*2/scale)/2), insetY=shrinkP*((wH-cardR*2/scale)/2), radius=(cardR/scale)*shrinkP;
  centerCard.style.transform=`scale(${scale.toFixed(4)})`;
  centerCard.style.clipPath=`inset(${insetY.toFixed(1)}px ${insetX.toFixed(1)}px round ${radius.toFixed(1)}px)`;

  /* Blur-fix: when the user scrolls back UP through the shrink zone
     (shrinkP transitions from high → low), the compositor may have
     cached a scaled-down raster. Force a one-shot puppet canvas resync
     on that transition so the puppet re-renders crisp. */
  if (typeof onProgress._lastShrink === 'undefined') onProgress._lastShrink = 0;
  if (onProgress._lastShrink > 0.3 && shrinkP < 0.3 && window._puppetResync) {
    window._puppetResync();
  }
  onProgress._lastShrink = shrinkP;

  /* Rive puppet fade: tied to "IS" word reveal — keep a min opacity so
     the puppet is always at least partially visible; full-fade only when
     IS is ~complete. */
  const riveClip=document.getElementById('rive-clip');
  if(riveClip){
    const isP=wordP(egp,2);
    riveClip.style.opacity=Math.max(0.35, 1-isP).toFixed(3);
    riveClip.style.pointerEvents=isP>=0.85?'none':'';
  }

  animThen(wordP(egp,0),wH); animWho(wordP(egp,1),wH);
  animIs(wordP(egp,2),wH);   animThe(wordP(egp,3),wH); animGoat(wordP(egp,4),wH);

  if(egp>=0.97){ fireDropTransition(); }
  else if(egp<0.94&&dropFired){ reverseDropTransition(); }
}

/* Reset intro animation state (called by global replay) */
window._introReset = function() {
  hasSeen[0]=hasSeen[1]=hasSeen[2]=hasSeen[3]=hasSeen[4]=false;
  if(dropTl){dropTl.kill();dropTl=null;}
  dropFired=false;
  if(goatFallTl){goatFallTl.kill();goatFallTl=null;}
  document.querySelectorAll('.player-card').forEach(b=>gsap.set(b,{opacity:1,scale:1}));
  wordEls.forEach(el=>gsap.set(el,{opacity:0,scaleX:1,scaleY:1,y:0,clipPath:'none',filter:'none'}));
  const goatLetters=wordEls[4].querySelectorAll('.ltr');
  goatLetters.forEach((_,li)=>{const s=getScatter(li);gsap.set(_,{x:s.x,y:s.y,rotation:s.rot,opacity:0});});
  const theLetters=wordEls[3].querySelectorAll('.ltr');
  theLetters.forEach((l,li)=>gsap.set(l,{x:li<2?-90:90,opacity:0}));
  onProgress(0);
};

/* Expose face builder for chart portrait rings */
window._buildFace = buildFace;

/* Create/recreate the ScrollTrigger pin (also called by global replay) */
function _createIntroPinTrigger() {
  _setStageHeight();
  ScrollTrigger.getAll().filter(t=>t.vars&&t.vars.id==='intro-pin').forEach(t=>t.kill());
  ScrollTrigger.create({
    id:'intro-pin',
    trigger:section,
    start:'top top',
    end:'bottom bottom',
    pin:stageEl,
    pinSpacing:false,
    invalidateOnRefresh:true,
    /* anticipatePin engages the pin slightly before the trigger line,
       so the hero→intro handoff glides instead of snapping. 1 is a
       whole-beat of anticipation — GSAP's recommended value for
       scroll-driven pin sequences. */
    anticipatePin:1,
    /* Default pinType (transform on touch, fixed on desktop) — paired
       with ScrollTrigger.normalizeScroll(true) in the head script,
       which is GSAP's purpose-built fix for mobile URL-bar-driven
       scroll measurement drift. */
    onUpdate:self=>onProgress(self.progress),
    onRefresh:self=>onProgress(self.progress),
  });
  onProgress(0);
}
window._introReinit = _createIntroPinTrigger;

/* Init on load (same timing as chart section) */
window.addEventListener('load', _createIntroPinTrigger);

/* Explicit pixel height for the pinned stage, with a grow-only high-
   water mark so mobile URL bar retract never shrinks the pinned
   viewport underneath us. Prefers visualViewport.height (stable during
   URL bar animations) over window.innerHeight (returns intermediate
   values mid-animation, the root cause of the scroll-down asymmetry). */
let _stageMaxH = 0;
function _currentVH() {
  if (window.visualViewport && window.visualViewport.height) {
    return Math.round(window.visualViewport.height);
  }
  return window.innerHeight || 0;
}
function _setStageHeight() {
  if (!stageEl) return;
  const h = _currentVH();
  if (h > _stageMaxH) _stageMaxH = h;
  if (_stageMaxH) stageEl.style.height = _stageMaxH + 'px';
}
_setStageHeight();
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', _setStageHeight, {passive:true});
}

/* Resize: re-drive animation at current scroll position. Height-only
   resizes update stage (grow-only) + re-drive onProgress; only width
   changes trigger a full ScrollTrigger.refresh (expensive + can snap
   scroll position). */
let _lastW = window.innerWidth, _refreshTimer;
window.addEventListener('resize',()=>{
  _setStageHeight();
  const total=section.offsetHeight-window.innerHeight;
  if(total>0) onProgress(clamp(-section.getBoundingClientRect().top/total,0,1));
  if (window.innerWidth !== _lastW) {
    _lastW = window.innerWidth;
    clearTimeout(_refreshTimer);
    _refreshTimer = setTimeout(()=>ScrollTrigger.refresh(), 180);
  }
},{passive:true});
/* Orientation change = new viewport universe. Reset the high-water
   mark so landscape → portrait picks up the correct (smaller) height
   instead of locking at the previous orientation. */
window.addEventListener('orientationchange',()=>{
  _stageMaxH = 0;
  setTimeout(()=>{ _setStageHeight(); ScrollTrigger.refresh(); }, 200);
},{passive:true});

/* Set initial column positions immediately so entry is correct */
onProgress(0);

})();
</script>

function renderTable() {
  const header=document.getElementById('table-header'), body=document.getElementById('table-body');
  PLAYERS.forEach(p=>{
    const d=document.createElement('div');
    d.className=`player-head phead-${p.id}`; d.id=`phead-${p.id}`;
    /* Portrait ring holds both initials (visible now) and face SVG (hidden, revealed during face transition) */
    const faceHtml=window._buildFace
      ? `<div class="pring-face" style="position:absolute;inset:0;border-radius:50%;overflow:hidden;opacity:0;">${window._buildFace(p.id)}</div>`
      : '';
    d.innerHTML=`<div class="portrait-ring" style="background:${p.bg};border-color:${p.accent}55;position:relative;">${faceHtml}<span class="initials" style="color:${p.accent};position:relative;z-index:1;">${p.initials}</span></div><span class="player-name-label">${p.name}</span>`;
    header.appendChild(d);
  });
  ROWS.forEach((row,ri)=>{
    const rowEl=document.createElement('div'); rowEl.className='cat-row'; rowEl.id=`row-${row.id}`;
    const lc=document.createElement('div'); lc.className='cat-label-col';
    lc.innerHTML=`<h3 class="cat-title-el" id="ct-${row.id}"></h3>${row.sub?`<p class="cat-sub-el">${row.sub}</p>`:''}`;
    rowEl.appendChild(lc);
    PLAYERS.forEach(p=>{
      const cd=row.cells[p.id], vl=cd.val.length, sz=vl<=3?'':vl<=10?' sm':' xs';
      const cel=document.createElement('div'); cel.className='p-cell'; cel.id=`cell-${row.id}-${p.id}`;
      cel.setAttribute('data-pid', p.id);
      /* Mobile ordering: CSS `order` property sorts cells within the row's
         flex/grid parent on mobile only. Desktop stays in fixed PLAYERS
         column order (unchanged); mobile reorders worst→best so the gold
         winner is the last thing the user reads per category. */
      if (row.mobileOrder) {
        const mIdx = row.mobileOrder.indexOf(p.id);
        if (mIdx !== -1) cel.style.setProperty('--m-order', mIdx);
      }
      /* Mobile-only portrait + name block (hidden on desktop via CSS).
         Portrait uses the same _buildFace renderer as the header row. */
      const faceHtml = window._buildFace
        ? `<div class="m-cell-face" style="background:${p.bg};border-color:${p.accent}55;">${window._buildFace(p.id)}</div>`
        : `<div class="m-cell-face" style="background:${p.bg};border-color:${p.accent}55;"><span style="color:${p.accent};font-size:13px;letter-spacing:.04em;">${p.initials}</span></div>`;
      const mHeader = `<div class="m-cell-header"><div class="m-cell-portrait">${faceHtml}</div><div class="m-cell-name" style="color:${p.accent};">${p.name}</div></div>`;
      /* Flavor rendering:
         - flavorList: bulleted stack (Page's life-after accolades)
         - flavor + flavor2: two-line fallback
         - flavor: single line                                               */
      let flavorHtml = '';
      if (cd.flavorList && cd.flavorList.length) {
        flavorHtml = `<ul class="cell-flavor-list" id="flav-${row.id}-${p.id}">${cd.flavorList.map(x=>`<li>${x}</li>`).join('')}</ul>`;
      } else if (cd.flavor || cd.flavor2) {
        flavorHtml = `<span class="cell-flavor" id="flav-${row.id}-${p.id}">${cd.flavor||''}${cd.flavor2?'<br>'+cd.flavor2:''}</span>`;
      }
      const mBody = `<div class="m-cell-body"><span class="cell-val${sz}" id="val-${row.id}-${p.id}">${cd.val}</span>${flavorHtml}${cd.lateLabel?`<span class="cell-late-label" id="late-${row.id}-${p.id}">${cd.lateLabel}</span>`:''}</div>`;
      cel.innerHTML = mHeader + mBody;
      rowEl.appendChild(cel);
    });

}

function typewrite(el,text,onDone) {
  el.innerHTML='';
  const cur=document.createElement('span'); cur.className='cat-cursor'; el.appendChild(cur);
  let i=0; const speed=Math.max(18,55-text.length*0.8);
  const t=setInterval(()=>{ if(i>=text.length){clearInterval(t);cur.remove();if(onDone)onDone();return;} cur.insertAdjacentText('beforebegin',text[i++]); },speed);
}

function typewriteInto(el,text) {
  el.textContent=''; let i=0;
  const t=setInterval(()=>{ if(i>=text.length){clearInterval(t);return;} el.textContent+=text[i++]; },52);
}

function countUp(el,target,duration) {
  const start=Date.now();
  const iv=setInterval(()=>{ const p=Math.min((Date.now()-start)/duration,1); el.textContent=Math.round((1-Math.pow(1-p,3))*target); if(p>=1) clearInterval(iv); },16);
}

function revealRow(row,rowEl) {
  rowEl.classList.add('dotted');
  typewrite(document.getElementById(`ct-${row.id}`),row.label,()=>{
    /* syncCount rows (e.g. NUMBER OF CHILDREN): every cell reveals at the
       same instant and every counter starts from 0 together with a shared
       duration. Alexander's 14 keeps ticking after the others plateau,
       turning the gold cell into a live visual payoff. */
    if (row.syncCount) {
      const SYNC_MS = 1600;
      row.order.forEach((pid)=>{
        const cd = row.cells[pid];
        const cel = document.getElementById(`cell-${row.id}-${pid}`);
        const valEl = document.getElementById(`val-${row.id}-${pid}`);
        /* Pre-zero the display so the count-up starts from 0 even before
           the cell has faded in — avoids a "14 → 0 → 14" flash. */
        if (valEl && cd.counter) valEl.textContent = '0';
        gsap.fromTo(cel, {clipPath:'inset(0 100% 0 0)', opacity:0},
                        {clipPath:'inset(0 0% 0 0)', opacity:1, duration:.35, ease:'power3.out',
          onComplete() {
            if (cd.color !== 'neutral') {
              cel.classList.add(cd.color);
              if (cd.dramatic) requestAnimationFrame(()=>{if(cd.color==='cg-gold')gsap.set(cel,{clearProps:'opacity'});cel.classList.add('pulse');});
            }
            if (cd.counter && valEl) countUp(valEl, parseInt(cd.val), SYNC_MS);
          }
        });
      });
      return;
    }

    row.order.forEach((pid,oi)=>{
      const cd=row.cells[pid], cel=document.getElementById(`cell-${row.id}-${pid}`);
      const valEl=document.getElementById(`val-${row.id}-${pid}`), flEl=document.getElementById(`flav-${row.id}-${pid}`);
      const isLast=oi===row.order.length-1;
      /* Reveal pacing: faster stagger, shorter wipe. Dramatic cells still
         get a pause but trimmed. Keeps the drama without the waiting. */
      const extraDelay=row.fastRow?0:(cd.dramatic?(isLast?0.30:0.18):0);
      const delay=oi*(row.fastRow?0.04:0.07)+extraDelay;
      gsap.fromTo(cel,{clipPath:'inset(0 100% 0 0)',opacity:0},{clipPath:'inset(0 0% 0 0)',opacity:1,duration:.30,ease:'power3.out',delay,
        onComplete(){
          if(cd.color!=='neutral'){cel.classList.add(cd.color);if(cd.dramatic)requestAnimationFrame(()=>{if(cd.color==='cg-gold')gsap.set(cel,{clearProps:'opacity'});cel.classList.add('pulse');});if(cd.persist)setTimeout(()=>{cel.classList.remove('pulse');cel.classList.add('breathe');},1200);}
          if(flEl)setTimeout(()=>{flEl.style.opacity='1';if(cd.typewriteFlavor&&cd.flavor)typewriteInto(flEl,cd.flavor);},cd.dramatic?300:120);
          if(cd.counter&&valEl){valEl.textContent='0';setTimeout(()=>countUp(valEl,parseInt(cd.val),900),100);}
          if(cd.lateLabel){const lateEl=document.getElementById(`late-${row.id}-${pid}`);if(lateEl){
            /* Late label appears first (after other cells finish) — the fact drops in red */
            const labelDelay=(row.order.length-1)*.07*1000+400+300+500;
            setTimeout(()=>lateEl.classList.add('in'),labelDelay);
            /* Then, after the fact has landed, black out the cell in response to it */
            setTimeout(()=>{cel.classList.remove('cg-faint','cg-mid','cg-strong','cg-deep','cg-gold','cr-deep','pulse','breathe');cel.classList.add('neutral');},labelDelay+900);
          }}
          if(row.id==='grandpa'&&pid==='rivers')setTimeout(()=>document.getElementById('phead-rivers')?.classList.add('lit'),400);
        }
      });
    });
  });
}

function setupChartInView() {
  var reduced   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isMobile  = window.matchMedia('(max-width: 768px)').matches;
  var traceFill = document.getElementById('trace-fill');

  /* ── Apply all cell colors and text immediately ──
     Desktop: chart is fully static — everything visible on load.
     Mobile:  colors applied, but cell opacity is CSS-driven (starts at 0).
              Per-row ScrollTriggers fade rows up on viewport entry.        */
  ROWS.forEach(function(row) {
    var labelEl = document.getElementById('ct-' + row.id);
    if (labelEl) labelEl.textContent = row.label;
    var rowEl = document.getElementById('row-' + row.id);
    if (rowEl) rowEl.classList.add('dotted');

    PLAYERS.forEach(function(p) {
      var cd   = row.cells[p.id];
      var cel  = document.getElementById('cell-' + row.id + '-' + p.id);
      var flEl = document.getElementById('flav-' + row.id + '-' + p.id);
      if (!cel || !cd) return;

      if (cd.color !== 'neutral') cel.classList.add(cd.color);

      if (!isMobile) {
        gsap.set(cel, { opacity: 1, clearProps: 'y,clipPath' });
        if (flEl) flEl.style.opacity = '1';
      } else {
        /* Mobile: flavor visible immediately (cell opacity handles the fade).
           Counter values start at 0 so count-up plays from 0 on reveal. */
        if (flEl) flEl.style.opacity = '1';
        if (cd.counter) {
          var valEl = document.getElementById('val-' + row.id + '-' + p.id);
          if (valEl) valEl.textContent = '0';
        }
      }
    });
  });

  /* Rivers portrait ring lights up since grandpa row is always visible */
  var ph = document.getElementById('phead-rivers');
  if (ph) ph.classList.add('lit');

  if (traceFill) traceFill.style.height = '100%';

  /* Logan Paul late-label handling ──
     Both desktop + mobile: hidden initially, revealed via scroll-past trigger
     below. On desktop, cell state + label reveal are triggered together. */
  var lateEl = document.getElementById('late-life-brady');

  /* Desktop + mobile shared Logan-Paul scroll-past trigger.
     Registered outside the mobile-only block so it fires on all viewports. */
  var lpTriggers = [];
  if (!reduced) {
    var lifeRowAll   = document.getElementById('row-life');
    var bradyCellAll = document.getElementById('cell-life-brady');
    if (lifeRowAll && bradyCellAll && lateEl) {
      /* Trigger fires AFTER the user has read Brady's life-after cell —
         i.e. the cell's bottom has scrolled past the middle of the viewport.
         Earlier versions used 'top 85%' which fired the Logan Paul gag
         as the cell was just entering view; reader feedback was that the
         reveal should land *after* they've absorbed the regular content. */
      var lpST = ScrollTrigger.create({
        trigger: bradyCellAll,
        start: 'bottom 40%',
        end:   'bottom top',
        onEnter: function() {
          bradyCellAll.classList.remove('cg-mid', 'cg-strong', 'cg-deep', 'cg-gold', 'cg-faint', 'cr-deep', 'pulse', 'breathe');
          bradyCellAll.classList.add('lp-reveal');
          lateEl.classList.add('in');
        },
        onLeaveBack: function() {
          bradyCellAll.classList.remove('lp-reveal');
          bradyCellAll.classList.add('cg-mid');
          lateEl.classList.remove('in');
        }
      });
      lpTriggers.push(lpST);
    }
  } else if (lateEl) {
    /* Reduced motion: show the label immediately */
    lateEl.classList.add('in');
  }

  /* ── Mobile row-enter + count-up triggers ── */
  var mobileTriggers = [];
  if (isMobile && !reduced) {
    ROWS.forEach(function(row) {
      var rowEl = document.getElementById('row-' + row.id);
      if (!rowEl) return;
      var cells = row.order.map(function(pid) {
        return document.getElementById('cell-' + row.id + '-' + pid);
      }).filter(Boolean);

      var st = ScrollTrigger.create({
        trigger: rowEl,
        start: 'top 85%',
        once: true,
        onEnter: function() {
          /* Row-label fade — no typewriter on mobile, just clean fade-up */
          gsap.fromTo(rowEl.querySelector('.cat-label-col'),
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: .35, ease: 'power2.out' });
          /* Cells DROP + BOUNCE from above — elastic so they feel like they
             got dropped there, not settled into place. */
          cells.forEach(function(cel, i) {
            var pid = cel.getAttribute('data-pid');
            var cd  = row.cells[pid];
            gsap.fromTo(cel,
              { opacity: 0, y: -60 },
              { opacity: 1, y: 0, duration: .75, ease: 'bounce.out',
                delay: i * 0.08,
                onComplete: function() {
                  if (cd.counter) {
                    var valEl = document.getElementById('val-' + row.id + '-' + pid);
                    if (valEl) countUp(valEl, parseInt(cd.val), 700);
                  }
                }
              });
          });
        }
      });
      mobileTriggers.push(st);
    });
  } else if (isMobile && reduced) {
    /* Reduced motion: show everything immediately, no scroll triggers */
    document.querySelectorAll('.p-cell').forEach(function(c) { c.style.opacity = '1'; });
    if (lateEl) lateEl.classList.add('in');
  }

  /* ── Cleanup for replay() ── */
  return function cleanup() {
    mobileTriggers.forEach(function(t) { try { t.kill(); } catch(e){} });
    lpTriggers.forEach(function(t) { try { t.kill(); } catch(e){} });
    if (lateEl) lateEl.classList.remove('in');
    if (ph) ph.classList.remove('lit');
    if (traceFill) traceFill.style.height = '0%';
  };
}


/* Animate chart header portrait faces in when header enters viewport */
function setupFaceTransition() {
  ScrollTrigger.create({
    id:'face-transition',
    trigger:'#table-header',
    start:'top 90%',
    once:true,
    onEnter:function(){
      PLAYERS.forEach(function(p,idx){
        const faceDiv=document.querySelector('#phead-'+p.id+' .pring-face');
        const initial=document.querySelector('#phead-'+p.id+' .initials');
        if(faceDiv) gsap.fromTo(faceDiv,{opacity:0,y:-20},{opacity:1,y:0,duration:0.35,ease:'power2.out',delay:idx*0.07});
        if(initial) gsap.to(initial,{opacity:0,duration:0.2,delay:idx*0.07});
      });
    }
  });
}

/* ─────────────────────────────────────────────
   CHART SUMMARY — renders a condensed highlight-only grid between the
   chart and the vote section. Portraits on top, below them one dot per
   chart-cell where the cell's color is gold/strong/deep/red. Empty cells
   render as faint outlines so the shape of the chart is implied without
   the text. Triggers on viewport enter; reverses when scrolled back up.
───────────────────────────────────────────── */

/* Map chart's color classes → summary's dot classes. Only "memorable" hits
   get a colored dot; cg-faint/cg-mid are deemphasized so gold payoffs pop. */
const SUMMARY_COLOR_MAP = {
  'cg-gold':   'is-gold',
  'cg-deep':   'is-deep',
  'cg-strong': 'is-strong',
  'cg-mid':    'is-mid',
  'cg-faint':  'is-faint',
  'cr-deep':   'is-red',
};

function renderChartSummary() {
  const portraitsEl = document.getElementById('csum-portraits');
  const gridEl      = document.getElementById('csum-grid');
  if (!portraitsEl || !gridEl) return;

  /* ── Portraits row ── */
  portraitsEl.innerHTML = '';
  PLAYERS.forEach(function(p) {
    const wrap = document.createElement('div');
    wrap.className = 'csum-portrait';
    wrap.id = 'csum-portrait-' + p.id;
    const faceHtml = window._buildFace ? window._buildFace(p.id) : '';
    wrap.innerHTML =
      '<div class="csum-portrait-ring" style="background:' + p.bg +
      ';border-color:' + p.accent + 'AA;">' + faceHtml + '</div>' +
      '<div class="csum-portrait-name">' + (p.name || p.id) + '</div>';
    portraitsEl.appendChild(wrap);
  });

  /* ── Highlight grid: one row per chart row, 5 cols (player order matches
        the header). A cell gets a colored dot only if its color is mapped
        above; otherwise it's a faint empty outline. ── */
  gridEl.innerHTML = '';
  ROWS.forEach(function(row) {
    PLAYERS.forEach(function(p) {
      const cd = row.cells[p.id];
      const cel = document.createElement('div');
      cel.className = 'csum-cell';
      cel.setAttribute('data-pid', p.id);
      cel.setAttribute('data-row', row.id);
      const mapped = cd && cd.color && SUMMARY_COLOR_MAP[cd.color];
      if (mapped) cel.classList.add(mapped);
      else cel.classList.add('empty');
      gridEl.appendChild(cel);
    });
  });
}

function setupChartSummaryInView() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile = window.matchMedia('(max-width: 768px)').matches;
  const section = document.getElementById('chart-summary');
  if (!section) return function(){};

  const portraits = Array.from(section.querySelectorAll('.csum-portrait'));
  const cells     = Array.from(section.querySelectorAll('.csum-cell'));
  const highlightCells = cells.filter(function(c){ return !c.classList.contains('empty'); });
  const emptyCells     = cells.filter(function(c){ return c.classList.contains('empty'); });

  /* Find the matching chart cell (by row + pid) for a summary cell. */
  function chartCellFor(summaryCell) {
    const rowId = summaryCell.getAttribute('data-row');
    const pid   = summaryCell.getAttribute('data-pid');
    return document.getElementById('cell-' + rowId + '-' + pid);
  }

  /* ── FLIP travel (desktop) ──
     For each highlight summary cell, read its current box + the matching
     chart cell's box, compute the delta, set the summary cell's transform
     to "starts at chart origin" (via CSS custom props), then flip .in on to
     animate transform:0. The chart cell simultaneously dims, so it feels
     handed off rather than duplicated.                                    */
  function flightActivate() {
    /* Reset any stale state first */
    cells.forEach(function(c){
      c.classList.remove('in','flight');
      c.style.transform = '';
      c.style.transition = '';
    });
    portraits.forEach(function(p){
      p.classList.remove('in','landed');
      p.style.transform = '';
      p.style.transition = '';
    });

    /* ── Portraits FLIP: each summary portrait starts at its chart-header
       counterpart's position (if visible in DOM), then flies + lands with
       a subtle vertical bounce. If the chart header isn't measurable, fall
       back to a quick drop so nothing stalls. ── */
    const portraitFlight = portraits.map(function(p) {
      const pid = p.id.replace('csum-portrait-', '');
      const src = document.getElementById('phead-' + pid);
      if (!src) return { p: p, ok: false };
      const pRect = p.getBoundingClientRect();
      const sRect = src.getBoundingClientRect();
      const dx = sRect.left + sRect.width/2  - (pRect.left + pRect.width/2);
      const dy = sRect.top  + sRect.height/2 - (pRect.top  + pRect.height/2);
      const scale = Math.max(.8, Math.min(3, sRect.width / Math.max(1, pRect.width)));
      return { p: p, ok: true, dx: dx, dy: dy, scale: scale };
    });

    portraitFlight.forEach(function(pf) {
      if (!pf.ok) return;
      pf.p.style.transition = 'none';
      pf.p.style.transform = 'translate(' + pf.dx.toFixed(1) + 'px,' + pf.dy.toFixed(1) + 'px) scale(' + pf.scale.toFixed(3) + ')';
      pf.p.style.opacity = '1';
    });

    void section.offsetWidth;

    portraitFlight.forEach(function(pf, i) {
      const delay = i * 70;
      setTimeout(function(){
        if (pf.ok) {
          /* Fly to resting spot, THEN add .landed for the bounce keyframe */
          pf.p.style.transition = 'transform .65s cubic-bezier(.22,.9,.25,1), opacity .4s ease';
          pf.p.style.transform = '';
          pf.p.classList.add('in');
          setTimeout(function(){ pf.p.classList.add('landed'); }, 620);
        } else {
          pf.p.classList.add('in');
          setTimeout(function(){ pf.p.classList.add('landed'); }, 550);
        }
      }, delay);
    });

    const PORTRAIT_DELAY = portraits.length * 70 + 120;

    /* Pre-measure chart cell rects once so layout thrash is minimal */
    const flightData = highlightCells.map(function(sc){
      const chartCell = chartCellFor(sc);
      if (!chartCell) return null;
      const scRect = sc.getBoundingClientRect();
      const ccRect = chartCell.getBoundingClientRect();
      const dx = ccRect.left + ccRect.width/2  - (scRect.left + scRect.width/2);
      const dy = ccRect.top  + ccRect.height/2 - (scRect.top  + scRect.height/2);
      const sx = ccRect.width  / Math.max(1, scRect.width);
      const sy = ccRect.height / Math.max(1, scRect.height);
      /* Clamp scale so off-screen giants don't break layout, but keep
         enough range that you can SEE the shrink during flight. */
      const sc_scale = Math.max(1.2, Math.min(3.2, (sx + sy) / 2));
      return { sc: sc, chartCell: chartCell, dx: dx, dy: dy, scale: sc_scale };
    }).filter(Boolean);

    /* Place each summary cell AT its chart-cell origin */
    flightData.forEach(function(d) {
      d.sc.style.transition = 'none';
      d.sc.style.transform = 'translate(' + d.dx.toFixed(1) + 'px,' + d.dy.toFixed(1) + 'px) scale(' + d.scale.toFixed(3) + ')';
      d.sc.classList.add('flight');
    });

    void section.offsetWidth;

    /* Release: animate transform back to 0 with a brisk shrink + slide home */
    flightData.forEach(function(d, i){
      const delay = PORTRAIT_DELAY + i * 55;
      setTimeout(function(){
        d.sc.style.transition = 'transform .7s cubic-bezier(.22,.9,.25,1), opacity .45s ease';
        d.sc.style.transform = '';
        d.sc.classList.add('in');
        /* Briefly flash the donor chart cell, then dim it — even if the
           chart is off-screen, any visible tail-row gives viewers a cue. */
        if (d.chartCell) {
          d.chartCell.classList.add('csum-flash');
          setTimeout(function(){
            if (d.chartCell) {
              d.chartCell.classList.remove('csum-flash');
              d.chartCell.classList.add('csum-handed');
            }
          }, 180);
        }
      }, delay);
    });

    /* Empty cells fade in after highlights have mostly landed */
    const emptyStart = PORTRAIT_DELAY + flightData.length * 55 + 180;
    emptyCells.forEach(function(c, i){
      setTimeout(function(){ c.classList.add('in'); }, emptyStart + i * 6);
    });
  }

  /* ── Mobile: simple fade-up, no flight (chart rows are full-width on
        mobile so flying dots from them is visually confusing). ── */
  function mobileActivate() {
    portraits.forEach(function(p, i) {
      setTimeout(function(){ p.classList.add('in'); }, i * 50);
    });
    const START = portraits.length * 50 + 60;
    highlightCells.forEach(function(c, i){
      setTimeout(function(){ c.classList.add('in'); }, START + i * 50);
    });
    const EMPTY_START = START + highlightCells.length * 50 + 120;
    emptyCells.forEach(function(c, i){
      setTimeout(function(){ c.classList.add('in'); }, EMPTY_START + i * 6);
    });
  }

  function activate() {
    if (isMobile || reduced) mobileActivate();
    else flightActivate();
  }

  function deactivate() {
    portraits.forEach(function(p){
      p.classList.remove('in','landed');
      p.style.transition = '';
      p.style.transform = '';
      p.style.opacity = '';
    });
    cells.forEach(function(c){
      c.classList.remove('in','flight');
      c.style.transition = '';
      c.style.transform = '';
    });
    document.querySelectorAll('.p-cell.csum-handed, .p-cell.csum-flash').forEach(function(cc){
      cc.classList.remove('csum-handed','csum-flash');
    });
  }

  if (reduced) {
    activate();
    return function cleanup() { deactivate(); };
  }

  const st = ScrollTrigger.create({
    id: 'chart-summary',
    trigger: section,
    start: 'top 100%',   /* fire as summary enters bottom of viewport */
    end:   'bottom 25%',
    onEnter:     activate,
    onLeaveBack: deactivate,
    onEnterBack: activate,
  });

  return function cleanup() {
    try { st.kill(); } catch(e){}
    deactivate();
  };
}


window.replay = function() {
  if(window._chartCleanup) window._chartCleanup(); /* resets chart section before killing STs */
  if(window._voteReset)   window._voteReset();
  ScrollTrigger.getAll().forEach(t=>t.kill());
  document.querySelectorAll('.p-cell').forEach(c=>{c.className='p-cell';c.style.cssText='';gsap.set(c,{opacity:1,clearProps:'y,clipPath,borderColor,boxShadow'});});
  document.querySelectorAll('.cell-flavor').forEach(f=>f.style.opacity='0');
  document.querySelectorAll('.cell-late-label').forEach(l=>l.classList.remove('in'));
  document.querySelectorAll('.cat-title-el').forEach(t=>t.innerHTML='');
  document.querySelectorAll('.cat-row').forEach(r=>r.classList.remove('dotted'));
  document.querySelectorAll('.player-head').forEach(h=>h.classList.remove('lit'));
  document.querySelectorAll('.pring-face').forEach(f=>f.style.opacity='0');
  document.querySelectorAll('.portrait-ring .initials').forEach(i=>i.style.opacity='');
  if(window._introReset) window._introReset();
  if(window._heroShowInitial) window._heroShowInitial();
  window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(()=>{
    if(window._heroReset) window._heroReset();
    window._chartCleanup = setupChartInView();
    if(window._chartSummaryCleanup) window._chartSummaryCleanup();
    window._chartSummaryCleanup = setupChartSummaryInView();
    setupFaceTransition();
    if(window._introReinit) window._introReinit();
    ScrollTrigger.refresh();
  },400);
};

window.addEventListener('load',()=>{
  renderTable();
  renderChartSummary();
  window._chartCleanup = setupChartInView();
  window._chartSummaryCleanup = setupChartSummaryInView();
  setupFaceTransition();
  setTimeout(()=>{
    ScrollTrigger.refresh();
    if(window.__scrollToVote){
      window.__scrollToVote=false;
      setTimeout(()=>{
        var el=document.getElementById('vote-section');
        if(el) window.scrollTo({top:el.offsetTop,behavior:'smooth'});
      },100);
    }
  },400);
});

document.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R') window.replay();});

})();
