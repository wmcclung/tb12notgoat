<script>
;(function() {

  var isKiosk = new URLSearchParams(location.search).get('kiosk') === '1';
  var sessionStore = isKiosk ? localStorage : sessionStorage;

  var VOTE_PLAYERS = [
    { id:'rivers',    name:'Philip Rivers',   primary:'#002A5E', accent:'#FFB612' },
    { id:'alexander', name:'Shaun Alexander',  primary:'#002244', accent:'#69BE28' },
    { id:'payton',    name:'Walter Payton',    primary:'#0B1F4E', accent:'#E87722' },
    { id:'page',      name:'Alan Page',        primary:'#3D1E6B', accent:'#B5985A' },
    { id:'brady',     name:'Tom Brady',        primary:'#001840', accent:'#C8102E' },
  ];

  /* PNGs, not SVGs — these player SVGs ship without internal <style>
     blocks or fill attributes, so they render as black silhouettes when
     loaded via <img src>. The PNG versions are the fully-colored art.
     (Same fix class as the tom-brady-shocked / crown swap earlier.) */
  var STICKER_ASSETS = {
    rivers:    'Assets/phillip-rivers.png',
    alexander: 'Assets/shaun-alexander.png',
    payton:    'Assets/walter-payton.png',
    page:      'Assets/alan-page.png',
    brady:     'Assets/tom-brady-crownless.png',
  };

  // ── State ──
  var voteState    = 'vote'; // 'vote' | 'celebration' | 'results'
  var chosenPlayer = null;
  var celebTimer = null, inactivityTimer = null;

  // ── DOM refs ──
  var section   = document.getElementById('vote-section');
  var voteEl    = section.querySelector('.vote-state');
  var celebEl   = section.querySelector('.celebration-state');
  var resultsEl = section.querySelector('.results-state');

  // ── localStorage / sessionStorage helpers ──
  function getVotes() {
    try { return JSON.parse(localStorage.getItem('goat_votes') || '{}'); } catch(e) { return {}; }
  }
  function writeVote(pid) {
    var v = getVotes();
    v[pid] = (v[pid] || 0) + 1;
    localStorage.setItem('goat_votes', JSON.stringify(v));
    /* SUPABASE: await supabase.from('votes').rpc('increment_vote', { player_id: pid }) */
  }
  function getSession() {
    try { return JSON.parse(sessionStore.getItem('goat_session') || 'null'); } catch(e) { return null; }
  }
  function setSession(data) { sessionStore.setItem('goat_session', JSON.stringify(data)); }
  function clearSession()   { sessionStore.removeItem('goat_session'); }

  // ── Build vote cards (circle + grid) ──
  function buildVoteCards() {
    var circleWrap = section.querySelector('.vote-orbit-wrap');
    var gridWrap   = section.querySelector('.vote-grid');
    /* Remove only previously-built cards — preserve the persistent orbit
       children (.vote-orbit-center and #vote-center-preview) which live
       in the source markup and are referenced by setupCenterPreview. */
    circleWrap.querySelectorAll('.vote-card-orbit').forEach(function(el){ el.remove(); });
    gridWrap.innerHTML = '';

    VOTE_PLAYERS.forEach(function(p, i) {
      // Grid card
      var gc = document.createElement('div');
      gc.className = 'vote-card vote-card-grid';
      gc.dataset.pid = p.id;
      gc.style.setProperty('--vote-accent', p.accent);
      var gr = document.createElement('div');
      gr.className = 'vote-face-ring';
      gr.style.cssText = 'border-color:' + p.accent + '88;background:#07090C;';
      if (window._buildFace) gr.innerHTML = window._buildFace(p.id);
      var gn = document.createElement('div');
      gn.className   = 'vote-card-name';
      gn.textContent = p.name.split(' ').slice(-1)[0];
      gc.appendChild(gr);
      gc.appendChild(gn);
      gc.addEventListener('click', (function(pid){ return function(){ handleVoteClick(pid); }; })(p.id));
      gridWrap.appendChild(gc);

      // Circle card (absolutely positioned by positionCircleCards)
      var cc = document.createElement('div');
      cc.id        = 'vote-card-' + p.id;
      cc.className = 'vote-card vote-card-orbit';
      cc.dataset.pid = p.id;
      cc.style.setProperty('--vote-accent', p.accent);
      var cr = document.createElement('div');
      cr.className = 'vote-face-ring';
      cr.style.cssText = 'border-color:' + p.accent + '88;background:#07090C;';
      if (window._buildFace) cr.innerHTML = window._buildFace(p.id);
      var cn = document.createElement('div');
      cn.className   = 'vote-card-name';
      cn.textContent = p.name.split(' ').slice(-1)[0];
      cc.appendChild(cr);
      cc.appendChild(cn);
      cc.addEventListener('click', (function(pid){ return function(){ handleVoteClick(pid); }; })(p.id));
      circleWrap.appendChild(cc);
    });
    setupCenterPreview();
    // positionCircleCards called after load via rAF — not here
  }

  function setupCenterPreview() {
    var preview     = document.getElementById('vote-center-preview');
    var previewImg  = document.getElementById('vote-preview-img');
    if (!preview || !previewImg) return;

    /* Map each player to their large hero illustration — on hover, the
       corresponding portrait swaps into the orbit's center with an
       accent-colored radial glow. Brady gets the "shocked" variant to
       reinforce the overall gag. */
    var HOVER_IMG = {
      brady:     'Assets/tom-brady-shocked.png',
      rivers:    'Assets/phillip-rivers.png',
      alexander: 'Assets/shaun-alexander.png',
      page:      'Assets/alan-page.png',
      payton:    'Assets/walter-payton.png',
    };

    var orbitCards = section.querySelectorAll('.vote-card-orbit');
    orbitCards.forEach(function(card) {
      var pid = card.dataset.pid;
      var p   = VOTE_PLAYERS.find(function(pl){ return pl.id === pid; });

      card.addEventListener('mouseenter', function() {
        if (voteState !== 'vote' || !p) return;
        var src = HOVER_IMG[pid];
        if (!src) return;
        previewImg.src = src;
        previewImg.alt = p.name;
        preview.style.setProperty('--preview-accent', p.accent);
        preview.classList.add('visible');
      });

      card.addEventListener('mouseleave', function() {
        preview.classList.remove('visible');
      });
    });
  }

  var _circleResizeTimer = null;

  function positionCircleCards() {
    var container  = section.querySelector('.vote-orbit-wrap');
    var headlineEl = section.querySelector('.vote-header');
    if (!container || !headlineEl) return;

    var availH = window.innerHeight - headlineEl.offsetHeight - 60;
    container.style.width    = '100%';
    container.style.height   = availH + 'px';
    container.style.position = 'relative';

    /* Card size tuned so portraits never crowd the center preview image.
       Radius picks from min of horiz/vert half minus half a card minus a
       generous gap — guarantees the preview region stays visually clear. */
    var cardSize = Math.round(Math.min(Math.max(window.innerWidth * 0.12, 140), 190));
    var cx       = container.offsetWidth  / 2;
    var cy       = container.offsetHeight / 2;
    /* Center preview takes up ~clamp(240px, 36vmin, 460px); the orbit must
       clear that with a ~40px gutter. Compute dynamically rather than
       capping at 300 so the orbit expands on tall/wide viewports. */
    var previewHalf = Math.min(230, Math.min(cx, cy) * 0.36);
    var minRadius   = previewHalf + cardSize / 2 + 40;
    var maxRadius   = Math.min(cx, cy) - cardSize / 2 - 10;
    var radius      = Math.round(Math.max(minRadius, Math.min(maxRadius, Math.min(cx, cy) * 0.72)));

    VOTE_PLAYERS.forEach(function(p, i) {
      var angle = (2 * Math.PI / VOTE_PLAYERS.length) * i - Math.PI / 2;
      var x     = cx + radius * Math.cos(angle) - cardSize / 2;
      var y     = cy + radius * Math.sin(angle) - cardSize / 2;
      var card  = document.getElementById('vote-card-' + p.id);
      if (!card) return;
      card.style.position  = 'absolute';
      card.style.left      = x + 'px';
      card.style.top       = y + 'px';
      card.style.width     = cardSize + 'px';
      card.style.height    = cardSize + 'px';
      card.style.transform = 'none'; // no rotation — faces stay upright

      var ring = card.querySelector('.vote-face-ring');
      if (ring) { ring.style.width = cardSize + 'px'; ring.style.height = cardSize + 'px'; }
    });
  }

  // ── Vote click handler ──
  function handleVoteClick(pid) {
    if (voteState !== 'vote') return;

    if (pid === 'brady') {
      if (window.dataLayer) window.dataLayer.push({ event: 'brady_click', section: 'vote' });
      /* Using www variant because the apex (riversgoat.com) currently
         has a DNS configuration issue; www resolves correctly. */
      window.location.href = 'https://www.riversgoat.com/';
      return;
    }

    writeVote(pid);
    setSession({ voted: true, choice: pid });
    chosenPlayer = pid;
    /* On mobile, skip the celebration animation and drop straight into
       results — reader feedback was that the animation blocks the
       leaderboard and doesn't center well on phone viewports. Desktop
       still gets the full celebration. Layout (below in CSS) is sized
       so sticker + leaderboard both fit inside 100dvh naturally, no
       auto-scrolling needed. */
    var isMobile = window.matchMedia('(max-width: 767px)').matches;
    transitionTo(isMobile ? 'results' : 'celebration');
  }

  // ── State machine ──
  function transitionTo(state) {
    voteState = state;
    voteEl.classList.remove('active');
    celebEl.classList.remove('active');
    resultsEl.classList.remove('active');

    if (state === 'vote') {
      voteEl.classList.add('active');
    } else if (state === 'celebration') {
      buildCelebration();
      celebEl.classList.add('active');
    } else if (state === 'results') {
      buildResults();
      resultsEl.classList.add('active');
      if (isKiosk) startInactivity();
    }
  }

  // ── Celebration state ──
  /* Builds the reveal moment after a user votes. Design goals:
     - No tap-hint text: a hairline timer bar at the bottom shows progress
     - On sticker landing, a radial accent-color sweep pulses from behind it,
       and ~30 tiny accent-colored particles burst outward briefly
     - The player's name cascades in letter-by-letter with a small overshoot
       ("nameplate slam") instead of a plain fade
     - A small counter ticks up showing "1 vote logged" (total count, from
       localStorage) so the reveal feels like you contributed to a thing
     - On desktop, the sticker gets a mousemove 3D tilt/parallax
     - Tap anywhere still skips forward to results                          */
  function buildCelebration() {
    var p = VOTE_PLAYERS.find(function(pl){ return pl.id === chosenPlayer; });
    if (!p) return;

    celebEl.innerHTML = '';
    gsap.set(celebEl, { opacity: 1 });

    var wrap = document.createElement('div');
    wrap.className = 'vote-celeb-wrap';

    /* Radial sweep layer — sits BEHIND the sticker; a team-color ring
       expands and fades out on landing. Two cycles = ripple effect. */
    var sweep = document.createElement('div');
    sweep.className = 'celeb-sweep';
    sweep.style.setProperty('--accent', p.accent);

    var sticker = document.createElement('div');
    sticker.className = 'sticker-placeholder celeb-sticker-el';
    sticker.id = 'celeb-sticker';
    sticker.style.cssText = 'box-shadow:0 0 60px ' + p.accent + '55;background:none;';
    sticker.innerHTML = '<img src="' + (STICKER_ASSETS[p.id]||'') + '" alt="' + p.id + '" style="width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;">';

    /* Particle container — populated on landing */
    var particles = document.createElement('div');
    particles.className = 'celeb-particles';
    particles.id = 'celeb-particles';

    /* Sticker shell wraps sweep + sticker + particles so the 3D tilt
       applies to the whole composed moment, not just the image */
    var stickerShell = document.createElement('div');
    stickerShell.className = 'celeb-sticker-shell';
    stickerShell.id = 'celeb-sticker-shell';
    stickerShell.appendChild(sweep);
    stickerShell.appendChild(sticker);
    stickerShell.appendChild(particles);

    /* Name: each letter gets its own span for the cascade slam-in */
    var celebName = document.createElement('div');
    celebName.className   = 'vote-celeb-name';
    celebName.id          = 'celeb-name';
    var letters = p.name.split('');
    letters.forEach(function(ch) {
      var sp = document.createElement('span');
      sp.className = 'celeb-letter';
      sp.textContent = ch === ' ' ? '\u00A0' : ch;
      celebName.appendChild(sp);
    });

    /* Vote counter — shows total votes for this player after writeVote
       has run (it runs in handleVote before transitionTo('celebration')) */
    var counter = document.createElement('div');
    counter.className = 'celeb-counter';
    counter.id = 'celeb-counter';
    var countNum = document.createElement('span');
    countNum.className = 'celeb-counter-num';
    countNum.id = 'celeb-counter-num';
    countNum.textContent = '0';
    var countLabel = document.createElement('span');
    countLabel.className = 'celeb-counter-label';
    countLabel.textContent = 'vote' + (0 === 1 ? '' : 's') + ' for ' + p.name.split(' ').slice(-1)[0];
    counter.appendChild(countNum);
    counter.appendChild(document.createTextNode(' '));
    counter.appendChild(countLabel);

    /* Timer bar — hairline at bottom of the wrap, fills over the auto-advance
       duration. Replaces the "tap to continue" text. */
    var timer = document.createElement('div');
    timer.className = 'celeb-timer';
    var timerFill = document.createElement('div');
    timerFill.className = 'celeb-timer-fill';
    timerFill.id = 'celeb-timer-fill';
    timerFill.style.background = p.accent;
    timer.appendChild(timerFill);

    wrap.appendChild(stickerShell);
    wrap.appendChild(celebName);
    wrap.appendChild(counter);
    wrap.appendChild(timer);
    celebEl.appendChild(wrap);

    /* ── Initial states ── */
    gsap.set(stickerShell, { y: '-110vh' });
    gsap.set(celebName.querySelectorAll('.celeb-letter'),
             { opacity: 0, y: -30, rotateX: -60 });
    gsap.set(counter,  { opacity: 0 });
    gsap.set(timerFill, { scaleX: 0, transformOrigin: 'left center' });

    /* ── Timeline ── */
    var tl = gsap.timeline();

    /* 1. Sticker drops in from above */
    tl.to(stickerShell, { y: 0, duration: 0.65, ease: 'expo.out' }, 0)
      /* 2. Landing bounce */
      .to(sticker, { scale: 1.08, duration: 0.1, ease: 'power2.out' }, 0.58)
      .to(sticker, { scale: 1.0,  duration: 0.22, ease: 'power2.inOut' }, 0.68);

    /* 3. On landing: trigger sweep + particles (CSS-driven, added via class) */
    tl.add(function(){
      sweep.classList.add('burst');
      spawnCelebParticles(particles, p.accent);
    }, 0.58);

    /* 4. Name letters slam in (cascade, 30ms apart, slight overshoot) */
    tl.to(celebName.querySelectorAll('.celeb-letter'),
          { opacity: 1, y: 0, rotateX: 0,
            duration: 0.5, ease: 'back.out(2.2)',
            stagger: 0.03 },
          0.55);

    /* 5. Counter fades in + ticks up AFTER the name lands */
    var totalVotes = (getVotes()[p.id]) || 1;
    tl.to(counter, { opacity: 1, duration: 0.35, ease: 'power2.out' }, 1.15);
    tl.add(function(){
      countLabel.textContent = 'vote' + (totalVotes === 1 ? '' : 's') + ' for ' + p.name.split(' ').slice(-1)[0];
      tickCounter(countNum, totalVotes, 800);
    }, 1.15);

    /* 6. Timer bar fills over the auto-advance window */
    var AUTO_MS = 3400;
    tl.to(timerFill, { scaleX: 1, duration: AUTO_MS / 1000, ease: 'none' }, 0.9);

    if (celebTimer) clearTimeout(celebTimer);
    celebTimer = setTimeout(advanceCelebration, AUTO_MS + 900);

    /* Tap anywhere to skip forward */
    function onCelebClick() {
      celebEl.removeEventListener('click', onCelebClick);
      if (voteState === 'celebration') advanceCelebration();
    }
    celebEl.addEventListener('click', onCelebClick);

    /* Desktop: 3D tilt on mouse move inside the sticker shell */
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      var rect = null;
      function onMove(e) {
        if (!rect) rect = stickerShell.getBoundingClientRect();
        var px = (e.clientX - rect.left) / rect.width;   // 0..1
        var py = (e.clientY - rect.top)  / rect.height;  // 0..1
        var rx = (0.5 - py) * 14;   // tilt up/down
        var ry = (px - 0.5) * 14;   // tilt left/right
        stickerShell.style.setProperty('--rx', rx.toFixed(2) + 'deg');
        stickerShell.style.setProperty('--ry', ry.toFixed(2) + 'deg');
      }
      function onLeave() {
        rect = null;
        stickerShell.style.setProperty('--rx', '0deg');
        stickerShell.style.setProperty('--ry', '0deg');
      }
      function onEnter() { rect = stickerShell.getBoundingClientRect(); }
      stickerShell.addEventListener('mouseenter', onEnter);
      stickerShell.addEventListener('mousemove',  onMove);
      stickerShell.addEventListener('mouseleave', onLeave);
    }
  }

  /* Spawn ~28 tiny accent-colored particles bursting radially from center.
     Particles use CSS custom props for per-particle angle + distance so the
     animation is entirely CSS-driven after spawn (cheap). */
  function spawnCelebParticles(container, color) {
    container.innerHTML = '';
    var N = 28;
    for (var i = 0; i < N; i++) {
      var ang  = (Math.random() * Math.PI * 2);
      var dist = 90 + Math.random() * 140;    // px
      var size = 3 + Math.random() * 4;       // px
      var dx   = Math.cos(ang) * dist;
      var dy   = Math.sin(ang) * dist;
      var d = document.createElement('span');
      d.className = 'celeb-particle';
      d.style.setProperty('--dx', dx.toFixed(1) + 'px');
      d.style.setProperty('--dy', dy.toFixed(1) + 'px');
      d.style.setProperty('--sz', size.toFixed(1) + 'px');
      d.style.setProperty('--dur', (0.55 + Math.random() * 0.35).toFixed(2) + 's');
      d.style.setProperty('--delay', (Math.random() * 0.08).toFixed(2) + 's');
      d.style.background = color;
      container.appendChild(d);
    }
  }

  /* Tick a number element from 0 → target over ms, integer frames */
  function tickCounter(el, target, ms) {
    var start = performance.now();
    function step(now) {
      var t = Math.min(1, (now - start) / ms);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(target * eased).toLocaleString();
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function advanceCelebration() {
    if (voteState !== 'celebration') return;
    if (celebTimer) { clearTimeout(celebTimer); celebTimer = null; }

    var shell = document.getElementById('celeb-sticker-shell');
    var tl = gsap.timeline({ onComplete: function(){ transitionTo('results'); } });
    if (shell) tl.to(shell, { y: '-50vh', scale: 0.32, duration: 0.5, ease: 'power3.in' }, 0);
    tl.to(celebEl, { opacity: 0, duration: 0.3, ease: 'power2.in' }, 0.15);
  }

  // ── Results state ──
  function buildResults() {
    var p = VOTE_PLAYERS.find(function(pl){ return pl.id === chosenPlayer; });
    if (!p) return;

    var votes = getVotes();
    /* SUPABASE: const { data } = await supabase.from('votes').select('*') — merge with localStorage totals */

    resultsEl.innerHTML = '';
    gsap.set(resultsEl, { opacity: 0 });

    // Top sticker (chosen player)
    var stickerTop = document.createElement('div');
    stickerTop.className = 'vote-results-sticker-top';
    var stickerEl = document.createElement('div');
    stickerEl.className = 'sticker-placeholder';
    stickerEl.style.cssText = 'box-shadow:0 0 40px ' + p.accent + '44;background:none;';
    stickerEl.innerHTML = '<img src="' + (STICKER_ASSETS[p.id]||'') + '" alt="' + p.id + '" style="width:100%;height:100%;object-fit:contain;display:block;">';
    var stickerLabel = document.createElement('div');
    stickerLabel.className   = 'vote-results-sticker-name';
    stickerLabel.textContent = 'Your vote';
    stickerTop.appendChild(stickerEl);
    stickerTop.appendChild(stickerLabel);
    resultsEl.appendChild(stickerTop);

    // Leaderboard: non-Brady sorted desc, Brady pinned last
    var nonBrady = VOTE_PLAYERS.filter(function(pl){ return pl.id !== 'brady'; })
      .slice().sort(function(a, b){ return (votes[b.id] || 0) - (votes[a.id] || 0); });
    var brady  = VOTE_PLAYERS.find(function(pl){ return pl.id === 'brady'; });
    var ranked = nonBrady.concat([brady]);
    var maxVotes = Math.max.apply(null, nonBrady.map(function(pl){ return votes[pl.id] || 0; }).concat([1]));

    var lb = document.createElement('div');
    lb.className = 'vote-leaderboard';

    ranked.forEach(function(pl, idx) {
      var row = document.createElement('div');
      row.className = 'vote-lb-row';
      row.id = 'vote-lb-row-' + pl.id;

      // Face
      var faceWrap = document.createElement('div');
      faceWrap.className = 'vote-lb-face';
      if (window._buildFace) faceWrap.innerHTML = window._buildFace(pl.id);

      // Info column
      var info = document.createElement('div');
      info.className = 'vote-lb-info';

      var nameRow = document.createElement('div');
      nameRow.className = 'vote-lb-name-row';

      var nameEl = document.createElement('span');
      nameEl.className   = 'vote-lb-name';
      nameEl.textContent = pl.name.split(' ').slice(-1)[0];
      nameRow.appendChild(nameEl);

      if (pl.id === chosenPlayer) {
        var pill = document.createElement('span');
        pill.className    = 'vote-lb-pill';
        pill.textContent  = 'Your Vote';
        pill.style.cssText = 'background:' + pl.accent + ';color:#fff;';
        nameRow.appendChild(pill);
      }
      info.appendChild(nameRow);

      // Vote bar
      var barTrack = document.createElement('div');
      barTrack.className = 'vote-bar-track';
      var barFill = document.createElement('div');
      barFill.className  = 'vote-bar-fill';
      barFill.id         = 'vote-bar-' + pl.id;
      barFill.style.background = pl.accent;
      barTrack.appendChild(barFill);
      info.appendChild(barTrack);

      // Count
      var countEl = document.createElement('div');
      countEl.className   = 'vote-lb-count';
      countEl.textContent = pl.id === 'brady' ? '0' : (votes[pl.id] || 0);

      row.appendChild(faceWrap);
      row.appendChild(info);
      row.appendChild(countEl);
      lb.appendChild(row);
    });

    resultsEl.appendChild(lb);

    // Reset button (kiosk only)
    var resetBtn = document.createElement('button');
    resetBtn.className   = 'vote-reset-btn' + (isKiosk ? ' visible' : '');
    resetBtn.textContent = 'Reset for next person ↺';
    resetBtn.addEventListener('click', doReset);
    resultsEl.appendChild(resetBtn);

    // Animate section and rows in
    gsap.to(resultsEl, { opacity: 1, duration: 0.35, ease: 'power2.out' });

    ranked.forEach(function(pl, idx) {
      var row = document.getElementById('vote-lb-row-' + pl.id);
      if (!row) return;
      gsap.to(row, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out', delay: 0.3 + idx * 0.06 });

      if (pl.id !== 'brady') {
        var pct = maxVotes > 0 ? (votes[pl.id] || 0) / maxVotes * 100 : 0;
        var bar = document.getElementById('vote-bar-' + pl.id);
        if (bar) gsap.to(bar, { width: pct + '%', duration: 0.6, ease: 'power2.out', delay: 0.35 + idx * 0.05 });
      }
    });
  }

  // ── Reset ──
  function doReset() {
    clearSession();
    chosenPlayer = null;
    stopInactivity();
    if (celebTimer) { clearTimeout(celebTimer); celebTimer = null; }
    transitionTo('vote');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── Inactivity timer (kiosk only) ──
  function resetInactivity() { stopInactivity(); startInactivity(); }
  function startInactivity() {
    inactivityTimer = setTimeout(doReset, 60000);
    ['touchstart','click','mousemove'].forEach(function(ev){
      section.addEventListener(ev, resetInactivity, { passive: true });
    });
  }
  function stopInactivity() {
    if (inactivityTimer) { clearTimeout(inactivityTimer); inactivityTimer = null; }
    ['touchstart','click','mousemove'].forEach(function(ev){
      section.removeEventListener(ev, resetInactivity);
    });
  }


  // ── Session restore on load ──
  function initSession() {
    // Web mode: clear session on every page load so refresh = new visitor
    // Kiosk mode: session persists in localStorage across refresh intentionally
    if (!isKiosk) sessionStorage.removeItem('goat_session');
    var sess = getSession();
    if (sess && sess.voted && sess.choice && !isKiosk) {
      // Web: reload into results showing prior vote
      chosenPlayer = sess.choice;
      transitionTo('results');
    } else {
      transitionTo('vote');
    }
  }

  // ── Expose reset so global replay() can call it ──
  window._voteReset = function() {
    clearSession();
    chosenPlayer = null;
    voteState  = 'vote';
    stopInactivity();
    if (celebTimer) { clearTimeout(celebTimer); celebTimer = null; }
    gsap.set(celebEl,   { clearProps: 'opacity' });
    gsap.set(resultsEl, { clearProps: 'opacity' });
    voteEl.classList.add('active');
    celebEl.classList.remove('active');
    resultsEl.classList.remove('active');
  };

  // ── Init ──
  function runCircleEntrance() {
    positionCircleCards();
    gsap.fromTo('.vote-card-orbit',
      { opacity: 0, scale: 0.4 },
      { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.4)',
        stagger: 0.07, delay: 0.1 }
    );
  }

  window.addEventListener('load', function() {
    buildVoteCards();
    initSession();

    // Wait for all ScrollTriggers (hero, intro, chart) to finish initializing
    ScrollTrigger.addEventListener('refresh', function onFirstRefresh() {
      ScrollTrigger.removeEventListener('refresh', onFirstRefresh);
      setTimeout(function() {
        requestAnimationFrame(runCircleEntrance);
      }, 100);
    });

    // Fallback: if refresh event already fired before listener registered
    setTimeout(function() {
      var cards = document.querySelectorAll('.vote-card-orbit');
      var allVisible = Array.prototype.every.call(cards, function(c) {
        return parseFloat(c.style.left) > 0;
      });
      if (!allVisible) runCircleEntrance();
    }, 800);
  });

  window.addEventListener('resize', function() {
    clearTimeout(_circleResizeTimer);
    _circleResizeTimer = setTimeout(positionCircleCards, 80);
  }, { passive: true });

})();
</script>

<!-- ── ELEMENT TUNER (activate with ?tune=1) ── -->
<script>
;(function() {
  if (new URLSearchParams(location.search).get('tune') !== '1') return;

  window.addEventListener('load', function() {

    // ── Kill scroll-pinning so entire page scrolls freely ──
    if (window.ScrollTrigger) {
      ScrollTrigger.getAll().forEach(function(st) { st.kill(); });
    }
    if (window._heroShowInitial) window._heroShowInitial();

    var box = document.getElementById('illo-wrap');
    if (!box) return;
    box.style.overflow = 'visible';

    // ── State machine ──
    var currentStateId = null;
    var active = null;
    var TARGETS = [];   // active target list for current state
    var dragSt = null, resizeSt = null, rotateSt = null;
    // For illo-wrap special drag (tracks GSAP y/scale, not style.left/top)
    var wrapDragSt = null;
    var _wrapY = 55, _wrapScale = 1.32;

    // ── Page states ──
    var STATES = [
      {
        id: 'normal',
        label: '🏈 Normal',
        color: '#aaaaaa',
        setup: function() {
          scrollToHero();
          if (window._heroShowInitial) window._heroShowInitial();
          gsap.set('#crown-svg',  { opacity: 1, x: 0, y: 0, scale: 1, rotation: window.CROWN_ROT || -20.4 });
          gsap.set('#hero-goat',  { opacity: 1, x: 0 });
          gsap.set('#illo-wrap',  { y: 0, scale: 1, transformOrigin: '50% 28%' });
          gsap.set('#subtext',    { opacity: 0 });
          gsap.set('#line-bottom',{ y: 0 });
          var bi = document.getElementById('hero-brady-img');
          if (bi) bi.src = 'Assets/tom-brady.png';
          if (window._positionCrown) window._positionCrown();
          if (window._positionGoat)  window._positionGoat();
        },
        targets: [
          { id: 'hero-brady-img', label: '🏈 Brady', color: '#aaaaaa', rotation: 0 },
          { id: 'crown-svg',      label: '👑 Crown', color: '#FFB612', rotation: -20.4 },
          { id: 'hero-goat',      label: '🐐 Goat',  color: '#00dd66', rotation: 0 },
        ]
      },
      {
        id: 'shocked',
        label: '😱 Shocked',
        color: '#ff6666',
        setup: function() {
          scrollToHero();
          if (window._heroShowInitial) window._heroShowInitial();
          var bi = document.getElementById('hero-brady-img');
          if (bi) bi.src = 'Assets/tom-brady-shocked.png';
          gsap.set('#hero-brady-img', { opacity: 1 });
          gsap.set('#crown-svg',      { opacity: 0 });
          gsap.set('#hero-goat',      { opacity: 0, x: 0 });
          gsap.set('#subtext',        { opacity: 1 });
          gsap.set('#line-bottom',    { y: 260 });
          gsap.set('#illo-wrap',      { y: _wrapY, scale: _wrapScale, transformOrigin: '50% 28%' });
        },
        targets: [
          { id: 'illo-wrap', label: '📦 Illo zoom', color: '#ff6666', isWrap: true },
          { id: 'subtext',   label: '📝 Subtext',   color: '#88aaff', rotation: 0 },
        ]
      }
    ];

    // ── Utility ──
    function scrollToHero() {
      var h = document.getElementById('hero');
      if (h) window.scrollTo({ top: h.offsetTop, behavior: 'smooth' });
    }

    function imgBounds() {
      var img = document.getElementById('hero-brady-img');
      if (!img || !img.naturalWidth) return null;
      var cW = box.offsetWidth, cH = box.offsetHeight;
      var iAR = img.naturalWidth / img.naturalHeight, cAR = cW / cH;
      var rW, rH, oX, oY;
      if (iAR > cAR) { rW=cW; rH=cW/iAR; oX=0; oY=(cH-rH)/2; }
      else            { rH=cH; rW=cH*iAR; oX=(cW-rW)/2; oY=0; }
      return { rW:rW, rH:rH, oX:oX, oY:oY };
    }

    // ── HUD ──
    var hud = document.createElement('div');
    hud.style.cssText = 'position:fixed;top:14px;right:14px;background:rgba(0,0,0,.94);color:#fff;font-family:monospace;font-size:12px;padding:14px 18px;border-radius:10px;z-index:99999;line-height:2;border:1px solid #444;min-width:260px;max-width:300px;';
    document.body.appendChild(hud);

    // ── Setup a state ──
    function activateState(stateObj) {
      // Tear down previous targets
      TARGETS.forEach(function(t) {
        if (t.el) { t.el.style.outline = ''; t.el.style.cursor = ''; }
        if (t.rh) t.rh.remove();
        if (t.oh) t.oh.remove();
      });
      TARGETS = [];
      active = null;

      currentStateId = stateObj.id;
      stateObj.setup();

      // Small delay so setup gsap.sets settle before we measure positions
      setTimeout(function() {
        stateObj.targets.forEach(function(def) {
          var el = document.getElementById(def.id);
          if (!el) return;
          var t = { id: def.id, label: def.label, color: def.color,
                    rotation: def.rotation || 0, isWrap: !!def.isWrap, el: el };

          if (t.isWrap) {
            // illo-wrap: dragging changes _wrapY/_wrapScale via GSAP, not style.left/top
            el.style.cursor = 'move';
            el.style.outline = '2px dashed ' + t.color + '88';
            el.addEventListener('mousedown', function(e) {
              selectTarget(t);
              wrapDragSt = { mx: e.clientX, my: e.clientY, sy: _wrapY, ss: _wrapScale };
              e.preventDefault(); e.stopPropagation();
            });
            // Scale handle for wrap
            var sh = document.createElement('div');
            sh.title = 'Scale (drag left=smaller / right=larger)';
            sh.style.cssText = 'position:fixed;width:20px;height:20px;background:#ff6666;border:2px solid #fff;border-radius:50%;cursor:ew-resize;z-index:99998;box-shadow:0 2px 6px rgba(0,0,0,.8);display:none;font-size:10px;text-align:center;line-height:18px;color:#fff;';
            sh.textContent = '↔';
            document.body.appendChild(sh);
            t.sh = sh;
            sh.addEventListener('mousedown', function(e) {
              selectTarget(t);
              wrapDragSt = { mx: e.clientX, my: e.clientY, sy: _wrapY, ss: _wrapScale, scaleOnly: true };
              e.preventDefault(); e.stopPropagation();
            });
          } else {
            // Regular absolute-positioned element
            var container = (def.id === 'subtext') ? document.body : box;
            t.container = container;
            var br = container.getBoundingClientRect();
            var er = el.getBoundingClientRect();
            // Brady needs flow → absolute conversion
            if (def.id === 'hero-brady-img') {
              el.style.position = 'absolute';
            }
            el.style.transform  = 'none';
            el.style.left       = (er.left - br.left + (def.id === 'subtext' ? 0 : 0)) + 'px';
            el.style.top        = (er.top  - br.top)  + 'px';
            el.style.cursor     = 'move';
            el.style.userSelect = 'none';
            el.style.outline    = '2px dashed ' + t.color + '88';

            var rh = document.createElement('div');
            rh.title = 'Resize (drag right)';
            rh.style.cssText = 'position:absolute;width:18px;height:18px;background:' + t.color + ';border:2px solid #fff;border-radius:50%;cursor:se-resize;z-index:99998;box-shadow:0 2px 6px rgba(0,0,0,.8);display:none;';
            container.appendChild(rh);
            t.rh = rh;

            var oh = document.createElement('div');
            oh.title = 'Rotate (drag left/right)';
            oh.style.cssText = 'position:absolute;width:18px;height:18px;background:#ff6600;border:2px solid #fff;border-radius:50%;cursor:ew-resize;z-index:99998;box-shadow:0 2px 6px rgba(0,0,0,.8);display:none;';
            container.appendChild(oh);
            t.oh = oh;

            el.addEventListener('mousedown', function(e) {
              selectTarget(t);
              dragSt = { mx: e.clientX, my: e.clientY,
                         sl: parseFloat(el.style.left)||0, st: parseFloat(el.style.top)||0 };
              e.preventDefault(); e.stopPropagation();
            });
            rh.addEventListener('mousedown', function(e) {
              selectTarget(t);
              resizeSt = { mx: e.clientX, sw: el.offsetWidth };
              e.preventDefault(); e.stopPropagation();
            });
            oh.addEventListener('mousedown', function(e) {
              selectTarget(t);
              rotateSt = { mx: e.clientX, sr: t.rotation };
              e.preventDefault(); e.stopPropagation();
            });
          }

          TARGETS.push(t);
        });
        renderList();
      }, 80);
    }

    // ── Selection ──
    function selectTarget(t) {
      TARGETS.forEach(function(x) {
        if (x.el) x.el.style.outline = '2px dashed ' + x.color + '44';
        if (x.rh) x.rh.style.display = 'none';
        if (x.oh) x.oh.style.display = 'none';
        if (x.sh) x.sh.style.display = 'none';
      });
      active = t;
      t.el.style.outline = '2px dashed ' + t.color;
      if (t.rh) t.rh.style.display = 'block';
      if (t.oh) t.oh.style.display = 'block';
      if (t.sh) t.sh.style.display = 'block';
      renderDetail();
    }

    function syncHandles(t) {
      if (!t || !t.el) return;
      if (t.isWrap) {
        // Position scale handle at bottom-right of illo-wrap in viewport coords
        var er = t.el.getBoundingClientRect();
        if (t.sh) {
          t.sh.style.left = (er.right - 10) + 'px';
          t.sh.style.top  = (er.bottom - 10) + 'px';
        }
        return;
      }
      var cont = t.container || box;
      var br = cont.getBoundingClientRect();
      var er = t.el.getBoundingClientRect();
      if (t.rh) {
        t.rh.style.left = (er.right  - br.left - 9) + 'px';
        t.rh.style.top  = (er.bottom - br.top  - 9) + 'px';
      }
      if (t.oh) {
        t.oh.style.left = (er.left + er.width / 2 - br.left - 9) + 'px';
        t.oh.style.top  = (er.top  - br.top - 28) + 'px';
      }
    }

    // ── Value computation ──
    function vals(t) {
      if (t.isWrap) {
        return { isWrap: true, y: _wrapY.toFixed(0), scale: _wrapScale.toFixed(3) };
      }
      var cont = t.container || box;
      var bw = cont.offsetWidth, bh = cont.offsetHeight;
      var lp = parseFloat(t.el.style.left) || 0;
      var tp = parseFloat(t.el.style.top)  || 0;
      var base = { wp: (t.el.offsetWidth / box.offsetWidth * 100).toFixed(1), rot: t.rotation.toFixed(1) };
      var ib = imgBounds();
      if (t.id === 'crown-svg' && ib) {
        var cx = lp + t.el.offsetWidth / 2;
        var cy = tp + t.el.offsetHeight * 0.55;
        base.imgX = ((cx - ib.oX) / ib.rW).toFixed(3);
        base.imgY = ((cy - ib.oY) / ib.rH).toFixed(3);
        base.label0 = 'CROWN_HEAD_X'; base.label1 = 'CROWN_HEAD_Y'; base.isImg = true;
      } else if (t.id === 'hero-goat' && ib) {
        base.imgX = ((lp - ib.oX) / ib.rW).toFixed(3);
        base.imgY = ((tp - ib.oY) / ib.rH).toFixed(3);
        base.label0 = 'GOAT_X'; base.label1 = 'GOAT_Y'; base.isImg = true;
      } else {
        base.lp = (lp / bw * 100).toFixed(1);
        base.tp = (tp / bh * 100).toFixed(1);
      }
      return base;
    }

    function copyStr(t) {
      var v = vals(t);
      if (v.isWrap)  return 'y: ' + v.y + ', scale: ' + v.scale + ', transformOrigin: \'50% 28%\'';
      if (v.isImg)   return v.label0 + ' = ' + v.imgX + ';\n' + v.label1 + ' = ' + v.imgY + ';\nROT = ' + v.rot + ';\nwidth: clamp(30px,' + v.wp + '%,400px);';
      return t.label + ':\nleft:' + v.lp + '%; top:' + v.tp + '%; width:clamp(30px,' + v.wp + '%,400px); transform:rotate(' + v.rot + 'deg);';
    }

    // ── Render ──
    function stateBar() {
      return '<div style="display:flex;gap:6px;margin-bottom:10px;">' +
        STATES.map(function(s) {
          var active = currentStateId === s.id;
          return '<button data-sid="' + s.id + '" style="flex:1;padding:5px 4px;background:' + (active ? s.color : '#222') + ';color:' + (active ? '#000' : s.color) + ';border:1px solid ' + s.color + ';border-radius:5px;cursor:pointer;font-family:monospace;font-size:11px;">' + s.label + '</button>';
        }).join('') + '</div>';
    }

    function renderList() {
      hud.innerHTML = stateBar() +
        '<div style="color:#aaa;font-size:10px;margin-bottom:6px">Select an element:</div>' +
        TARGETS.map(function(x) {
          return '<div data-tid="' + x.id + '" style="margin-top:5px;cursor:pointer;padding:5px 8px;border-radius:4px;border:1px solid ' + x.color + ';color:' + x.color + ';">' + x.label + '</div>';
        }).join('');
      bindStateButtons();
      TARGETS.forEach(function(x) {
        var btn = hud.querySelector('[data-tid="' + x.id + '"]');
        if (btn) btn.onclick = function() { selectTarget(x); };
      });
    }

    function renderDetail() {
      if (!active) { renderList(); return; }
      var t = active;
      var v = vals(t);
      var posLines;
      if (v.isWrap) {
        posLines = 'y:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b style="color:#0ff">' + v.y + 'px</b><br>' +
                   'scale:&nbsp;<b style="color:#0ff">' + v.scale + '</b><br>';
      } else if (v.isImg) {
        posLines = v.label0 + ':&nbsp;<b style="color:#0ff">' + v.imgX + '</b><br>' +
                   v.label1 + ':&nbsp;<b style="color:#0ff">' + v.imgY + '</b><br>';
      } else {
        posLines = 'left:&nbsp;<b style="color:#0ff">' + v.lp + '%</b><br>' +
                   'top:&nbsp;&nbsp;<b style="color:#0ff">' + v.tp + '%</b><br>';
      }
      hud.innerHTML = stateBar() +
        '<div style="color:' + t.color + ';font-size:13px;font-weight:bold;margin-bottom:3px">' + t.label + '</div>' +
        '<div style="color:#666;font-size:10px;margin-bottom:6px">' + (t.isWrap ? 'Drag=move · ↔=scale' : 'Drag=move · Green=resize · Orange=rotate') + '</div>' +
        posLines +
        (v.isWrap ? '' : 'width:&nbsp;<b style="color:#0ff">' + v.wp + '%</b><br>rotate:&nbsp;<b style="color:#0ff">' + v.rot + 'deg</b><br>') +
        '<button id="t-copy" style="margin-top:8px;width:100%;background:#C8102E;color:#fff;border:none;padding:7px;border-radius:5px;cursor:pointer;font-family:monospace;font-size:12px;">Copy values</button>' +
        '<button id="t-back" style="margin-top:5px;width:100%;background:#222;color:#888;border:none;padding:5px;border-radius:5px;cursor:pointer;font-family:monospace;font-size:11px;">← Back</button>';

      bindStateButtons();
      document.getElementById('t-copy').onclick = function() {
        navigator.clipboard.writeText(copyStr(t)).then(function(){});
        this.textContent = '✓ Copied!';
        var btn = this;
        setTimeout(function() { if (active) renderDetail(); }, 1500);
      };
      document.getElementById('t-back').onclick = function() { active = null; renderList(); };
      syncHandles(t);
    }

    function bindStateButtons() {
      hud.querySelectorAll('[data-sid]').forEach(function(btn) {
        btn.onclick = function() {
          var sid = btn.getAttribute('data-sid');
          var s = STATES.filter(function(x){ return x.id === sid; })[0];
          if (s) activateState(s);
        };
      });
    }

    // ── Global mouse events ──
    document.addEventListener('mousemove', function(e) {
      if (wrapDragSt) {
        var dy = e.clientY - wrapDragSt.my;
        var dx = e.clientX - wrapDragSt.mx;
        if (!wrapDragSt.scaleOnly) _wrapY = wrapDragSt.sy + dy;
        _wrapScale = Math.max(0.5, wrapDragSt.ss + dx * 0.005);
        gsap.set('#illo-wrap', { y: _wrapY, scale: _wrapScale });
        if (active) { syncHandles(active); renderDetail(); }
        return;
      }
      if (!active) return;
      var el = active.el;
      if (dragSt) {
        el.style.left = (dragSt.sl + e.clientX - dragSt.mx) + 'px';
        el.style.top  = (dragSt.st + e.clientY - dragSt.my) + 'px';
        syncHandles(active); renderDetail();
      }
      if (resizeSt) {
        el.style.width = Math.max(20, resizeSt.sw + e.clientX - resizeSt.mx) + 'px';
        syncHandles(active); renderDetail();
      }
      if (rotateSt) {
        active.rotation = rotateSt.sr + (e.clientX - rotateSt.mx) * 0.6;
        el.style.transform = 'rotate(' + active.rotation + 'deg)';
        renderDetail();
      }
    });

    document.addEventListener('mouseup', function() {
      dragSt = resizeSt = rotateSt = wrapDragSt = null;
    });

    // ── Boot into Normal state ──
    activateState(STATES[0]);
  });
})();
</script>

<!-- Global keep-scrolling hint — auto-hides when the vote section is in view. -->
<div class="keep-scrolling" id="keep-scrolling" aria-hidden="true">Keep scrolling</div>
<script>
(function() {
  var hint = document.getElementById('keep-scrolling');
  var vote = document.getElementById('vote-section');
  if (!hint || !vote || !('IntersectionObserver' in window)) return;
  new IntersectionObserver(function(entries) {
    entries.forEach(function(en) {
      hint.classList.toggle('hide', en.isIntersecting);
    });
  }, { threshold: 0.15 }).observe(vote);
})();
</script>

<!-- ═══════════════════════════════════════════
     DIAGNOSTIC OVERLAY — ?debug=1 adds visible borders + a live
     dimensions panel so we can see exactly what the pinned stage,
     rive-clip, and card columns look like on a real device.
     Disabled by default.
════════════════════════════════════════════ -->
<script>
(function(){
  /* Two opt-in paths so redirects that strip the query string (apex→www)
     can't lock the user out: either ?debug=1 in the URL OR #debug in the
     hash works. */
  var q = new URLSearchParams(location.search).get('debug') === '1';
  var h = location.hash === '#debug' || location.hash === '#debug=1';
  if (!q && !h) return;
  /* Visible outlines on the key boxes */
  var style = document.createElement('style');
  style.textContent = [
    '#section-stage   { outline: 3px solid #FF2D9E !important; outline-offset: -3px; }',
    '.intro-section   { outline: 2px dashed #1EE4FF !important; outline-offset: -2px; }',
    '#rive-clip       { outline: 2px solid #FFC700 !important; outline-offset: -2px; }',
    '#rive-dance-party, #rive-rocking-party { outline: 1px dashed #00FF00 !important; }',
    '.cards-col       { outline: 2px dotted #FF4D5E !important; }',
    '.center-card     { outline: 1px dashed #FFFFFF !important; }',
  ].join('\n');
  document.head.appendChild(style);

  /* Live readout panel — pinned bottom-left, always on top */
  var panel = document.createElement('div');
  panel.style.cssText =
    'position:fixed; left:6px; bottom:6px; z-index:99999;'+
    'background:rgba(0,0,0,.86); color:#0F0;'+
    'font:11px/1.35 ui-monospace,monospace; padding:8px 10px;'+
    'border:1px solid #0F0; border-radius:4px; max-width:76vw;'+
    'pointer-events:none; white-space:pre;';
  document.body.appendChild(panel);

  function fmt(el, label) {
    if (!el) return label + ': (missing)';
    var r = el.getBoundingClientRect();
    var cs = getComputedStyle(el);
    return label + ' ' + Math.round(r.width) + '×' + Math.round(r.height) +
           '  top=' + Math.round(r.top) + '  pos=' + cs.position;
  }

  function update() {
    var vhPx  = getComputedStyle(document.documentElement).getPropertyValue('--vh-px').trim();
    var stage = document.getElementById('section-stage');
    var clip  = document.getElementById('rive-clip');
    var col   = document.getElementById('col-fl');
    var intro = document.getElementById('intro-section');
    var danceC= document.getElementById('rive-dance-party');
    var stgH  = stage ? getComputedStyle(stage).height : '-';
    var stgIn = stage ? stage.style.height : '-';
    var canvasLine = '-';
    if (danceC) {
      canvasLine = 'cvs  el:' + danceC.offsetWidth + '×' + danceC.offsetHeight +
                   '  buf:' + danceC.width + '×' + danceC.height;
    }
    var vv = window.visualViewport;
    var vvStr = vv ? ('vv: ' + Math.round(vv.height) + '×' + Math.round(vv.width) +
                      '  offY:' + Math.round(vv.offsetTop) +
                      '  scale:' + vv.scale.toFixed(2))
                   : 'vv: (unsupported)';
    panel.textContent = [
      'innerH: ' + window.innerHeight + '  innerW: ' + window.innerWidth,
      vvStr,
      '--vh-px: ' + (vhPx || '(unset)'),
      'intro.offsetH: ' + (intro ? intro.offsetHeight : '-'),
      'stage CSS-h: ' + stgH + '  inline:' + stgIn,
      fmt(stage, 'stage'),
      fmt(clip,  'rive '),
      canvasLine,
      fmt(col,   'col-fl'),
      'scrollY: ' + window.scrollY,
    ].join('\n');
  }
  update();
  window.addEventListener('scroll',  update, {passive:true});
  window.addEventListener('resize',  update, {passive:true});
  window.addEventListener('orientationchange', update, {passive:true});
  setInterval(update, 500);  /* catch GSAP-driven changes */
})();
</script>

<!-- ── Rive runtime (shared — was loaded by the old single-canvas init
     which is now gone; the dual-canvas init below needs it) ── -->
<script src="https://unpkg.com/@rive-app/canvas@latest/rive.js"></script>

<!-- ══════════════════════════════════════════
     SECTION 01b JS — BRADY PARTY PAYOFF
     Dual Rive puppets + scroll-driven phase machine + accolade cards.
     Lights / strobe / specks are pure CSS (ambient, not scroll-driven).
══════════════════════════════════════════ -->
<script>
(function() {
  var danceCanvas = document.getElementById('rive-dance-party');
  var rockCanvas  = document.getElementById('rive-rocking-party');
  if (!danceCanvas || !rockCanvas) return;

  var danceInst = null, rockInst = null;
  /* Scroll-scrub contract: both puppets load with autoplay:false, SM paused,
     and we call r.scrub(animName, time) each tick so the dance tracks scroll
     position. Per Rive file author the dance_v2 animation is ~1.5s; we use
     heavier loop multipliers for the party (8×) so Brady visibly dances
     harder once the lights come on. */
  var DANCE_ANIM = 'dance_v2';
  var DANCE_DURATION = 1.5;
  /* Loop counts scaled so the party scrubs at ~intro's pace (400vh/loop).
     Party is now 700vh total, so dance = ~1.75 loops (700/400);
     rock runs at ~2× that rate for party-intensity. */
  var DANCE_LOOPS_IDLE  = 1.75;
  var ROCK_LOOPS_PARTY  = 3.5;

  function sizeCanvas(c) {
    var dpr = window.devicePixelRatio || 1;
    var w = c.offsetWidth  || c.parentElement.offsetWidth  || 300;
    var h = c.offsetHeight || c.parentElement.offsetHeight || 400;
    c.width  = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
  }
  function loadBuf(src, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', src, true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = function() {
      if (xhr.status === 0 || xhr.status === 200) cb(null, xhr.response);
      else cb(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = function() { cb(new Error('XHR error loading ' + src)); };
    xhr.send();
  }
  function initPuppet(canvas, src, setter) {
    sizeCanvas(canvas);
    loadBuf(src, function(err, buf) {
      if (err) { console.error('[Party]', src, err); return; }
      var r = new rive.Rive({
        buffer: buf, canvas: canvas,
        animations: DANCE_ANIM,
        autoplay: false,
        fit: rive.Fit.Cover,
        alignment: rive.Alignment.TopCenter,
        onLoad: function() {
          r.resizeDrawingSurfaceToCanvas();
          try { r.scrub(DANCE_ANIM, 0); } catch(e) { console.warn('[Rive] scrub not supported on', src, e); }
          setter(r);
          try {
            console.log('[Rive loaded]', src,
              '\n  animationNames    =', JSON.stringify(r.animationNames),
              '\n  stateMachineNames =', JSON.stringify(r.stateMachineNames),
              '\n  scrub available   =', typeof r.scrub === 'function');
          } catch(e) {}
        },
        onLoadError: function(e) { console.error('[Party rive]', src, e); }
      });
    });
  }

  /* Phase timeline — progress 0-1 across the PARTY portion of the intro.
     (The intro's global scroll runs 0-1 across 2300vh; the first ~30%
     of that — 700vh — is the party, and this local 0-1 maps to that.)
       0.00-0.38  DANCE     dance puppet visible, cream bg
       0.38-0.42  FLASH     lightning sweep, cross-fade to rocking
       0.42-0.84  PARTY     rocking puppet, lights on, cards pop in
       0.84-0.88  EXIT      cards glitch out
       0.88-1.00  WIND-DOWN lights fade, cross-fade back to dance, cream returns */
  /* Spaced out to ~11% between pop-ins (was 8%) so each card reads as
     its own beat instead of a rapid cascade. Card 4 (the 286-wins
     finale) holds on its own for a longer beat before everyone exits
     — gives the reader time to register it as the payoff stat. */
  var CARD_SCHED = [
    { in:0.43, out:0.82 },
    { in:0.55, out:0.83 },
    { in:0.67, out:0.85 },
    { in:0.78, out:0.91 },  /* 286 card holds nearly all the way to wind-down */
  ];
  var PARTY_START = 0.42, PARTY_END = 0.92;
  var lightningFired = false;

  /* Called by the intro's onProgress each scroll tick. gpLocal is the
     party-phase progress (0-1 across the first 30% of intro scroll).
     Anything outside [0,1] means we're past the party; the update
     clamps and cleans up (party-on removed, cards reset). */
  function partyUpdate(gpLocal) {
    var p = Math.max(0, Math.min(1, gpLocal));
    var stage     = document.getElementById('section-stage');
    var lightning = document.getElementById('party-lightning');
    var cards     = [].slice.call(document.querySelectorAll('.accolade'));

    /* Scrub rock to local party progress so it fully cycles through the
       party phase regardless of how long the rest of the intro is. */
    if (rockInst && typeof rockInst.scrub === 'function') {
      try { rockInst.scrub(DANCE_ANIM, p * DANCE_DURATION * ROCK_LOOPS_PARTY); } catch(e) {}
    }

    /* Lightning one-shot at the flash window. */
    if (lightning) {
      if (p >= 0.38 && p <= 0.42 && !lightningFired) {
        lightning.classList.remove('flash');
        void lightning.offsetWidth;
        lightning.classList.add('flash');
        lightningFired = true;
      } else if ((p < 0.36 || gpLocal > 1) && lightningFired) {
        lightningFired = false;
        lightning.classList.remove('flash');
      }
    }

    /* Party-on toggles lights + club bg + puppet cross-fade on the
       section-stage (used to live on party-inner, but the party section
       has been folded into the intro section). */
    if (stage) {
      var onNow = gpLocal >= 0 && gpLocal <= 1 && p >= PARTY_START && p <= PARTY_END;
      stage.classList.toggle('party-on', onNow);
    }

    /* Cards — idempotent per tick. */
    for (var i = 0; i < cards.length; i++) {
      var el = cards[i], s = CARD_SCHED[i];
      if (!s) continue;
      var inWin  = gpLocal >= 0 && gpLocal <= 1 && p >= s.in && p < s.out;
      var exited = gpLocal >= 0 && gpLocal <= 1 && p >= s.out;
      el.classList.toggle('in',  inWin);
      el.classList.toggle('out', exited);
      if (!inWin && !exited) { el.classList.remove('in'); el.classList.remove('out'); }
    }
  }

  /* Dance puppet scrub — driven across the whole intro (not just the
     party phase) so it stays alive through the shrink + words beats too.
     Called by the intro's onProgress every scroll tick. */
  function danceScrubGlobal(gp) {
    if (!danceInst || typeof danceInst.scrub !== 'function') return;
    /* ~5 full cycles across the 2300vh intro — intro pace is ~460vh per loop. */
    try { danceInst.scrub(DANCE_ANIM, gp * DANCE_DURATION * 5); } catch(e) {}
  }

  /* Forced canvas resync — the center-card's shrink transform can cause
     the browser compositor to cache a scaled-down rasterization of the
     canvas, producing blur when the user scrolls back up past the chart
     and the puppet grows back to full size. Re-initializing Rive's
     drawing surface forces a crisp re-render. */
  window._puppetResync = function() {
    sizeCanvas(danceCanvas); sizeCanvas(rockCanvas);
    if (danceInst) danceInst.resizeDrawingSurfaceToCanvas();
    if (rockInst)  rockInst.resizeDrawingSurfaceToCanvas();
  };

  /* Cheap auto-resync — checks canvas backing store size vs element
     size on a throttled interval. Rewrites + resizes only when they
     drift (e.g. after mobile URL-bar transitions leave Rive's internal
     drawing surface stuck at the pre-transition dimensions, producing
     the "shoes only visible at top of clip" bug). */
  var _lastCanvasW = 0, _lastCanvasH = 0;
  setInterval(function() {
    if (!danceCanvas) return;
    var dpr = window.devicePixelRatio || 1;
    var targetW = Math.round((danceCanvas.offsetWidth  || 0) * dpr);
    var targetH = Math.round((danceCanvas.offsetHeight || 0) * dpr);
    if (!targetW || !targetH) return;
    if (targetW !== _lastCanvasW || targetH !== _lastCanvasH) {
      _lastCanvasW = targetW; _lastCanvasH = targetH;
      sizeCanvas(danceCanvas); sizeCanvas(rockCanvas);
      if (danceInst) danceInst.resizeDrawingSurfaceToCanvas();
      if (rockInst)  rockInst.resizeDrawingSurfaceToCanvas();
    }
  }, 400);

  /* Expose to the intro's onProgress. */
  window._partyUpdate = partyUpdate;
  window._danceScrub  = danceScrubGlobal;

  /* Seed 60-80 tiny white specks with randomized position, twinkle duration
     and delay. Goal: "distant lights in a club" — visible but subtle, not
     the focal point. Each speck is a blurred absolutely-positioned div so
     CSS can handle the staggered twinkle animation. */
  function seedSpecks() {
    var host = document.getElementById('party-specks');
    if (!host || host.children.length) return;
    var COUNT = 72;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < COUNT; i++) {
      var s = document.createElement('div');
      s.className = 'speck';
      var size = 4 + Math.random() * 2;                /* 4-6 px */
      s.style.width = s.style.height = size.toFixed(2) + 'px';
      s.style.left = (Math.random() * 100).toFixed(2) + '%';
      s.style.top  = (Math.random() * 100).toFixed(2) + '%';
      s.style.setProperty('--dur',   (1.0 + Math.random() * 1.4).toFixed(2) + 's');
      s.style.setProperty('--delay', (-Math.random() * 2.8).toFixed(2) + 's');
      s.style.setProperty('--peak',  (0.45 + Math.random() * 0.35).toFixed(2));
      frag.appendChild(s);
    }
    host.appendChild(frag);
  }

  function initParty() {
    if (typeof rive === 'undefined') {
      /* Rive library hasn't loaded yet — retry shortly. */
      setTimeout(initParty, 80); return;
    }
    seedSpecks();
    initPuppet(danceCanvas, 'Assets/puppet/bradywithbones2.riv',             function(r){ danceInst = r; });
    initPuppet(rockCanvas,  'Assets/puppet/tombradywithbonesrockloop.riv',   function(r){ rockInst  = r; });
    /* (No ScrollTrigger here — the intro's onProgress calls
       window._partyUpdate(gpLocal) and window._danceScrub(gp) every tick.) */

    window.addEventListener('resize', function() {
      sizeCanvas(danceCanvas); sizeCanvas(rockCanvas);
      if (danceInst) danceInst.resizeDrawingSurfaceToCanvas();
      if (rockInst)  rockInst.resizeDrawingSurfaceToCanvas();
    });

    /* Re-sync on section re-entry — fixes scroll-back blur on the puppet.
       Why this bug exists: during the shrink phase the center-card
       transform scales the canvas down to ~12% of its layout size. The
       browser's compositor caches that scaled-down raster and reuses it
       when the transform returns to scale 1.0 (scroll-up from chart back
       into intro), producing a stretched/blurry image. Forcing the Rive
       backing store to re-initialize on section re-entry makes Rive
       re-rasterize at current DPR.
       Triple-resync (immediate + 80ms + 240ms) catches cases where layout
       is still settling after a pin release; multiple thresholds make
       sure the observer actually fires across slow scroll-ins. */
    function resyncCanvases() {
      sizeCanvas(danceCanvas); sizeCanvas(rockCanvas);
      if (danceInst) danceInst.resizeDrawingSurfaceToCanvas();
      if (rockInst)  rockInst.resizeDrawingSurfaceToCanvas();
    }
    var section = document.getElementById('intro-section');
    if (section && 'IntersectionObserver' in window) {
      new IntersectionObserver(function(entries) {
        entries.forEach(function(en) {
          if (!en.isIntersecting) return;
          resyncCanvases();
          setTimeout(resyncCanvases, 80);
          setTimeout(resyncCanvases, 240);
        });
      }, { threshold: [0, 0.01, 0.1, 0.25] }).observe(section);
    }
    /* Tab visibility → DPR can change when switching monitors/windows.
       Re-sync after visibility restore so the puppet stays crisp. */
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) setTimeout(resyncCanvases, 80);
    });
  }

  window.addEventListener('load', function() { setTimeout(initParty, 60); });
})();
</script>
